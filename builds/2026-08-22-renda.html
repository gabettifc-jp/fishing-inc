  }
  txt('転生でもらえる量 '+presGain(S.rec.earn), x+6, y+h-16, 10, '#8fa3b0');
}

function drawBand(){
  const r = rods[0];
  if (!r || r.phase!=='play') return;
  const now = performance.now()/1000;
  if (r.bandT0==null) r.bandT0=now;
  const grow = Math.min(1, (now - r.bandT0)/Math.max(0.001,T.bandPop));
  const h = Math.floor(T.bandH*grow);
  const y = Math.floor((cv.height-T.bandH)/2);
  box(0,y,cv.width,h,'#0a0f13','#3a4d59');            // 全釣り場で同じ色
  if (grow<1) return;
  const syms = r.tl.syms;
  // 帯は20拍ぶんの固定幅（カウントイン4拍 ＋ 譜面の枠16拍）。符号数によらず同じ（9章）
  const beats = T.countInBeats + frameBeats();
  const bw = beats * T.beatW;
  const x0 = Math.floor((cv.width - bw)/2);
  const px = t => x0 + (t / beatSec()) * T.beatW;     // 秒 -> 画面のx
  // カウントインの区間（符号を置かない。ここで拍を掴む）
  box(x0, y+8, T.countInBeats*T.beatW, T.bandH-16, '#0d151b');
  for (let k=1;k<=T.countInBeats;k++)
    box(x0 + k*T.beatW - 1, y+T.bandH/2-2, 2, 4, '#3a4d59');
  // 符号。長音の帯は「離してよい位置」までで描く（9章「長音の帯の描き方」）
  const nowS = performance.now()/1000;
  for (let i=0;i<syms.length;i++){
    const sy = syms[i];
    const x = px(sy.start), w = (sy.dur / beatSec()) * T.beatW;
    const res = r.res[i];
    let col = res==='hit' ? '#7fd6a0' : res==='graze' ? '#e8c05a' : res==='miss' ? '#e0736b' : '#e8eef2';
    // 押した瞬間、符号が一瞬ふくらんで戻る（8章0）。保持中は変えない
    let g = 0;
    if (sy.flash!=null && nowS - sy.flash < T.flashSec){
      const pr = 1 - (nowS - sy.flash)/Math.max(0.001,T.flashSec);
      g = T.symGrow*3*pr; col = '#ffffff';
    }
    if (sy.long){
      // 頭・胴の二部品で描く（9章）。胴は細く、頭は短音とまったく同じ点
      const span = Math.max(6, w-3);
      const full = Math.max(6, span*T.holdKeep);          // 離してよい位置まで
      const bh = Math.max(2, T.holdBodyH), by = y+T.bandH/2 - bh/2;
      box(x+full, by, Math.max(0,span-full), bh, '#1e2c34');   // 切った先は薄い影
      const held = (r.holding && r.aim===i);
      if (held){                                          // 通り過ぎた部分の色が変わる
        const done = Math.max(0, Math.min(full, px(r.t) - x));
        box(x, by, done, bh, '#cfe4ee');
        box(x+done, by, full-done, bh, col);
      } else {
        box(x, by, full, bh, col);
      }
    }
    // 頭は長音も短音も同じ点。長音はこの後ろに胴が伸びる（9章）
    box(x-g/2, y+T.bandH/2-4-g/2, 8+g, 8+g, col);
    // 押す位置に縮む輪（9章）。**符号にぴったり重なった瞬間が押す時**
    if (T.apOn && !res){
      const ap = Math.max(0.01, T.apBeats*beatSec());
      const left = sy.start - r.t;                       // あと何秒で来るか
      if (left <= ap && left > -0.05){
        const u = Math.max(0, left/ap);                  // 1=出はじめ 0=ちょうど
        const rad = 4 + (T.apStart-1)*4*u;               // 符号の半径4に寄っていく
        ctx.globalAlpha = 0.25 + 0.55*(1-u);
        ctx.strokeStyle = '#cfe4ee'; ctx.lineWidth = T.apW;
        ctx.beginPath();
        ctx.arc(x+4, y+T.bandH/2, rad, 0, Math.PI*2);
        ctx.stroke();
        ctx.globalAlpha = 1; ctx.lineWidth = 1;
      }
    }
  }
  // 光の線が左から右へ。カウントインのあいだは鈍い色
  const lx = px(r.t);
  ctx.fillStyle = (r.t < beatSec()*T.countInBeats) ? '#5b6d78' : '#ffffff';
  ctx.fillRect(Math.floor(lx), y+8, 2, T.bandH-16);
  // 連続の演出
  if (combo>0) txt('×'+combo+'!', 12, y+T.bandH/2-10, 16, '#7fd6a0');
  // 外したときの向き。方向だけ出す（8章0）
  if (dirMsg && nowS < dirUntil) txt(dirMsg, cv.width/2, y-20, 15, '#e8c05a', 'center');
  txt(GRADES[r.grade]+'（'+syms.length+'符号）', cv.width-12, y+6, 11, '#8fa3b0','right');
}

function drawFxA(){
  const now = performance.now()/1000;
  for (const f of fx){
    if (f.kind==='perfect'||f.kind==='soso'||f.kind==='miss'){
      const a = (f.until-now)/f.dur;
      ctx.globalAlpha = Math.max(0,Math.min(1,a));
      /* **画面ぜんぶを覆う返しは、プレイヤーの竿のときだけ（9章の決）。**
         自動の竿は終盤に毎秒十数回上げるので、画面が点滅し続ける */
      const byHand = !(f.rod && f.rod.auto);
      if (f.kind==='perfect' && byHand){ ctx.globalAlpha=a*0.25; box(0,TOPH,cv.width,cv.height-TOPH,'#7fd6a0'); }
      if (f.grade===2 && byHand){ ctx.globalAlpha=a*0.4; ctx.strokeStyle='#fff'; ctx.strokeRect(1,TOPH+1,cv.width-2,cv.height-TOPH-2); }
      ctx.globalAlpha=1;
    }
    // 釣果の札（9章）。絵・名前・一匹の値段。**所持金は上端に出ているので出さない**
    if (f.kind==='card' && f.rod && f.rod.last){
      const L = f.rod.last, left = (f.until-now)/f.dur;
      const a = Math.max(0, Math.min(1, left*3));
      const rise = (1-left) * T.fxCardRise;
      const w = fishW(L.grade), cx = cv.width/2, cy = cv.height*0.60 - rise;
      ctx.globalAlpha = a;
      if (L.result==='miss'){ ctx.globalAlpha = a*0.45; }
      drawFish(cx - w*0.55, cy, w, S.place, L.slot);
      ctx.globalAlpha = a;
      const name = FISH[S.place][L.slot];
      txt((L.result==='miss'?'逃した ':'')+name, cx + w*0.15, cy-14,
          L.grade>=3?15:12, L.result==='miss'?'#e0736b':'#e8eef2');
      if (L.money) txt(yen(L.money), cx + w*0.15, cy+2, L.grade>=3?15:12, '#e8c05a');
      if (L.isNew) txt('初', cx + w*0.15 - 16, cy-30, 12, '#7fd6a0');
      ctx.globalAlpha = 1;
    }
    if (f.kind==='digit'){
      const a=(f.until-now)/f.dur; ctx.globalAlpha=a;
      txt('円', cv.width/2, cv.height*0.3, 40, '#e8c05a','center'); ctx.globalAlpha=1;
    }
  }
}

/* --- 画面B：転生 --------------------------------------------------------- */
// ページ送りは第37版でやめた（25行を一画面に出す）。読み込む古い保存が持っていても使わない
/* 型の**画面に出す名前**（第37版）。
   「掛かる型／開く型／持ち越し型」は 7章の内部の呼び名で、**遊ぶ人には意味が通らない。**
   7章の定義をそのまま短くした言葉に置き換える（内部の名前は変えない）。
     掛かる型   … 道具の効きを恒久で押し上げる → **ずっと効く**
     開く型     … 新しい仕組みが出る。遊び方が変わる → **新しく開く**
     持ち越し型 … 前の周のものを持って始める → **次に持ち越す** */
const KIND_NAME = {'掛かる型':'ずっと効く', '開く型':'新しく開く', '持ち越し型':'次に持ち越す'};
const KIND_COL  = {'掛かる型':'#f0c674', '開く型':'#8fc7cd', '持ち越し型':'#9fd4ef'};
const kindName = k => KIND_NAME[k] || k;

/* パークの一覧の形（9章・第37版）。**案1（札を厚くする）＋案5（一枚に全部）。**
   **ページ送りをやめた。**25行を三列で一画面に出す ── 相場の言い方は
   「強化の一覧は常に画面に在る」で、Cookie Clicker は717個あってもページを分けない
   〔`gamedev/references/incremental-perks.md` A-9〕。
   前は10件／頁で、**25行を見るのに三回めくっていた。選ぶ前にめくらせていた。**
   描くところと測るところで同じ式を使う（別々に持つと片方だけ古くなる） */
function perkGeom(){
  const listY = TOPH+94, rowH = 26, cols = 3;
  const listH = cv.height-listY-30;
  const perCol = Math.floor(listH/rowH);
  return {listY, listH, rowH, cols, perCol, perPage: perCol*cols};
}
/* 並び（決・第32版）。**値段の安い順にしない。**
   湧いている → まだ湧いていない（近い順）→ 取り切った。
   湧いているものの中は種類ごとにまとめる */
function perkOrder(){
  const KINDS = ['掛かる型','開く型','持ち越し型'];
  const rank = pk => perkDone(pk) ? 2 : perkOpen(pk) ? 0 : 1;
  return PERKS.slice().sort((x,y)=>{
    const rx=rank(x), ry=rank(y);
    if (rx!==ry) return rx-ry;
    if (rx===1){
      const cx=perkCond(x), cy=perkCond(y);
      const dx = cx ? (cx[2]-cx[1])/Math.max(1,cx[2]) : 9, dy = cy ? (cy[2]-cy[1])/Math.max(1,cy[2]) : 9;
      return dx-dy;
    }
    const kx=KINDS.indexOf(x.kind), ky=KINDS.indexOf(y.kind);
    if (kx!==ky) return kx-ky;
    return PERKS.indexOf(x)-PERKS.indexOf(y);
  });
}

  drawGround();

  /* 見出し。今回いくら稼いで、何がもらえるか */
  {
    const hy = TOPH+4;
    box(8, hy, W-16, 84, '#0b151a', '#22333c');
    ctx.fillStyle = P.glow; ctx.fillRect(9, hy+1, T.uiBarW, 82);
    txt('転生', 8+T.uiBarW+10, hy+6, 12, '#9fb6c4');
    glow(8+T.uiBarW+130, hy+22, 110, P.glow, 0.14);
    txt('今回の釣果', 8+T.uiBarW+10, hy+24, 10, '#7d919c');
    txt(yen(S.rec.earn), 8+T.uiBarW+72, hy+18, 18, lit(P.glow,0.35));
    const before = S.pres - S.rec.presGot;
    txt('もらえる', W-232, hy+6, 10, '#7d919c');
    txt('+'+S.rec.presGot, W-178, hy+3, 15, '#7fd6a0');

    txt(before+' → '+S.pres, W-178, hy+25, 13, '#e8eef2');
    txt('ここで使える', W-16, hy+6, 10, '#7d919c', 'right');
    txt('×'+(S.pres/Math.max(1,before)).toFixed(2), W-16, hy+26, 12, '#9fb6c4', 'right');

    // 持ち越し。端で折り返す
    const slots = carrySlots();
    txt('持ち越し '+S.carrySel.length+'／'+slots+'枠', 8+T.uiBarW+10, hy+46, 10, '#7d919c');
    let x = 8+T.uiBarW+86, cy2 = hy+44;
    ctx.font='10px monospace';
    const carryables = TOOLS.map(t=>({id:t.id, n:t.n, now:S.tools[t.id]+'段', rate:t.carry}))
      .concat([{id:'money', n:'所持金', now:yenShort(S.money), rate:'carryMoney'}]);
    for (const c of carryables){
      const on = S.carrySel.includes(c.id);
      const label = c.n+' '+c.now+' →'+pc(carryRate(c.rate));
      const cw = Math.ceil(ctx.measureText(label).width)+12;
      if (x+cw > W-12){ x = 8+T.uiBarW+10; cy2 += 18; }
      box(x, cy2, cw, 15, on?'#1b3240':'#111d24', on?lit(P.glow,0.05):'#22333c');
      if (on){ ctx.fillStyle=P.glow; ctx.fillRect(x+1, cy2+1, 2, 13); }
      txt(label, x+(on?6:4), cy2+2, 10, slots?(on?'#e8eef2':'#7d919c'):'#4a5a63');
      if (slots) hs(x, cy2, cw, 15, ()=>{
        const i=S.carrySel.indexOf(c.id);
        if (i>=0) S.carrySel.splice(i,1);
        else if (S.carrySel.length<slots) S.carrySel.push(c.id);
      });
      x += cw+3;
    }
  }

  // 一覧。**25行ぜんぶ。ページ送りは無い**
  const G = perkGeom();
  const colW = (W-20)/G.cols;
  perkOrder().slice(0, G.perPage).forEach((pk,i)=>{
    const c = Math.floor(i/G.perCol), rI = i%G.perCol;
    const px = 10 + c*colW, py = G.listY + rI*G.rowH, pw = colW-6, ph = G.rowH-3;
    const done = perkDone(pk), open = perkOpen(pk);
    const cost = perkCost(pk), can = !done && open && S.pres>=cost;
    const col = done ? '#7fd6a0' : open ? KIND_COL[pk.kind] : '#2a3b44';
    box(px, py, pw, ph,
        done?'#152c22' : can?'#16262e' : open?'#111d24' : '#0b1216',
        done?'#2f5a45' : open?'#243943' : '#18242a');
    // **左の帯が型を持つ。**色だけでなく、下の名前でも出す
    ctx.fillStyle = col; ctx.fillRect(px+1, py+1, T.uiBarW, ph-2);
    const tx = px+T.uiBarW+6;
    const step = perkStep(pk), max = perkMax(pk);
    // 一行目：名前（段があれば段数も）と、値段／条件／済み
    const tag = (pk.type==='one'||max===1) ? '' : (step+'／'+(max===Infinity?'∞':max)+' ');
    // 右に出すもの（値段／条件／済み）の幅を先に測り、名前はその手前で切る
    const right = done ? '✓' : !open ? perkNeed(pk) : String(Math.ceil(cost));
    const rSize = done ? 10 : !open ? 9 : 11;
    ctx.font=rSize+'px "Hiragino Kaku Gothic ProN","Noto Sans JP",monospace';
    const rW = ctx.measureText(right).width;
    txtClip(tag+pk.name, tx, py+2, 10,
        done?'#7fd6a0' : !open?'#46565f' : can?'#e8eef2':'#5b6d78',
        pw-T.uiBarW-14-rW);
    if (open && !done && can) glow(px+pw-24, py+8, 28, P.glow, 0.14);
    txt(right, px+pw-6, py+(done?2:!open?3:2), rSize,
        done?'#7fd6a0' : !open?'#6b7c86' : can?lit(P.glow,0.25):'#5b6d78', 'right');
    /* 二行目：**「いま → 取った後」を全行に出す**（9章の決）。
       ページ送りをやめて行を詰めたので、ここが落ちやすい。**落とさない** */
    txtClip(perkEff(pk), tx, py+13, 8.5,
        done?'#5b8a72' : !open?'#333e45' : can?'#9fb6c4':'#4a5a63', pw-T.uiBarW-10);
    // 段のある行は、下の縁が進み具合の帯になる
    if (max!==1 && max!==Infinity && !done){
      ctx.fillStyle='#1b2a32'; ctx.fillRect(px+T.uiBarW+2, py+ph-2, pw-T.uiBarW-4, 1);
      ctx.fillStyle=col; ctx.fillRect(px+T.uiBarW+2, py+ph-2, (pw-T.uiBarW-4)*step/max, 1);
    }
    if (can) hs(px,py,pw,ph, ()=>buyPerk(pk));
  });

  /* 下の帯。**「もうすぐ湧く」の欄は要らなくなった** ── 湧いていないものも全部見えている */
  {
    const by = H-26;
    const open = PERKS.filter(p=>!perkDone(p)&&perkOpen(p)).length;
    const doneN = PERKS.filter(p=>perkDone(p)).length;
    // 型の凡例。**色が何を意味するかを、画面に置いておく**
    let lx = 12;
    for (const k of ['掛かる型','開く型','持ち越し型']){
      ctx.fillStyle=KIND_COL[k]; ctx.fillRect(lx, by+7, 3, 9);
      txt(kindName(k), lx+7, by+6, 9.5, '#7d919c');
      ctx.font='9.5px monospace'; lx += 7+ctx.measureText(kindName(k)).width+14;
    }
    txt('取れる '+open+'　取った '+doneN+'／'+PERKS.length, lx+6, by+6, 9.5, '#4a5a63');
    box(W-112,by,100,20,'#1b3240', lit(P.glow,0.05));
    ctx.fillStyle=P.glow; ctx.fillRect(W-111,by+1,2,18);
    txt('次へ（転生）',W-102,by+4,11, lit(P.glow,0.3));
    hs(W-112,by,100,20,()=>doPrestige());
  }
}

      const caught = S.dex[p].filter(Boolean).length;
      txt(caught+'／'+FISH[p].length, x+w-8, y+58, 11, '#9fb6c4','right');
      // 埋まり具合を細い帯で。**数字より先に、目に入る**
      const bw=w-T.uiBarW-14;

      // **行を分ける。**同じ行に置くと、値段が長い釣り場で移動手段と重なる
      txt(PLACES[p].move, x+T.uiBarW+6, y+74, 10, '#5b6d78');
      txt(yenShort(moveCost(p)), x+w-8, y+90, 10, '#4a5a63','right');

}

/* --- 図鑑 ---------------------------------------------------------------- */
let dexSel = null;                  // 図鑑で選んでいる魚 [釣り場, 枠]
function drawDex(){
  const W=cv.width, H=cv.height;
  const X=16, Y=16, BW=W-32, BH=H-32;
  ctx.globalAlpha=0.86; box(0,0,W,H,'#04080a'); ctx.globalAlpha=1;
  box(X,Y,BW,BH,'#0a1216','#2f4a56');
  const P = PLACES[S.place];
  ctx.fillStyle=dim(P.glow,0.35); ctx.fillRect(X,Y,BW,1);

  txt('図鑑', X+12, Y+8, 15, lit(P.glow,0.35));
  txt(dexCount()+'／'+dexTotal(), X+56, Y+11, 12, '#9fb6c4');
  if (has('opn8'))
    txt('埋まり具合で売値 +'+(T.opn8v*dexCount()*100).toFixed(1)+'%',
        X+BW-70, Y+11, 11, '#7fd6a0','right');

  /* **九枠ぜんぶ出す。**前は各釣り場の 5 枠しか描いておらず、
     72種のうち 32種が図鑑に出ていなかった（5章は魚72種） */
  const rowH = Math.floor((BH-84)/8);
  const nameW = 78, cellW = (BW-24-nameW)/9;
  for (let p=0;p<8;p++){
    const y = Y+34+p*rowH;
    const all = placeAllCaught(p);
    const got = S.dex[p].filter(Boolean).length;
    // 釣り場の名前と、埋まり具合
    txt((p+1)+' '+PLACES[p].n, X+12, y+rowH/2-11, 10, all?'#7fd6a0':'#9fb6c4');
    txt(got+'／9', X+12, y+rowH/2+2, 9, all?'#7fd6a0':'#5b6d78');
    box(X+12, y+rowH-8, nameW-18, 2, '#1b2a32');
    ctx.fillStyle = all?'#7fd6a0':PLACES[p].glow;
    ctx.fillRect(X+12, y+rowH-8, (nameW-18)*got/9, 2);
    if (all) txt('+'+(T.dexAllBonus*100)+'%', X+12+nameW-20, y+rowH/2+2, 9, '#7fd6a0','right');
    for (let sl=0;sl<9;sl++){
      const cx = X+12+nameW+cellW*(sl+0.5), cy = y+rowH/2-2;
      const caught = S.dex[p][sl];
      const sel = dexSel && dexSel[0]===p && dexSel[1]===sl;
      if (sel){ box(cx-cellW/2+1, y+1, cellW-2, rowH-4, '#16262e', lit(P.glow,0.1)); }
      // **釣っていないものは影で出す。**形は出るが、色と目は出ない
      drawFish(cx, cy, Math.min(T.dexPx, cellW-6), p, sl, caught?null:{dark:'#25373f'});
      if (SLOT_GRADE[sl]===4)                        // 主は枠でも分かるように
        txt('主', cx-cellW/2+3, y+2, 8, caught?lit(PLACES[p].glow,0.3):'#3f4c54');
      hs(cx-cellW/2, y, cellW, rowH-2, ()=>{ dexSel = sel?null:[p,sl]; });
    }
  }
  // 選んだ魚の一行。**名前と値段はここだけに出す**（枠に入れると読めない大きさになる）
  {
    const dy = Y+BH-30;
    box(X+8, dy, BW-16, 24, '#0d181d', '#22333c');
    if (dexSel){
      const [p,sl] = dexSel, caught = S.dex[p][sl];
      const g = SLOT_GRADE[sl];
      ctx.fillStyle = PLACES[p].glow; ctx.fillRect(X+9, dy+1, T.uiBarW, 22);
      if (caught){
        txt(FISH[p][sl], X+8+T.uiBarW+8, dy+6, 12, '#e8eef2');
        txt(GRADES[g]+'　'+PLACES[p].n+'　'+caught+'匹', X+8+T.uiBarW+112, dy+7, 10, '#7d919c');
        txt(yen(unitPrice(p,g)), X+BW-16, dy+6, 12, lit(PLACES[p].glow,0.3),'right');
      } else {
        txt('まだ釣っていない', X+8+T.uiBarW+8, dy+6, 12, '#5b6d78');
        txt(GRADES[g]+'　'+PLACES[p].n, X+8+T.uiBarW+112, dy+7, 10, '#4a5a63');
      }
    } else {
      txt('魚をひとつ押すと、名前と値段が出る', X+8+T.uiBarW+8, dy+6, 11, '#4a5a63');
    }
  }
  const cw=46; box(X+BW-cw-8,Y+6,cw,17,'#16262e','#2f4a56');
  txt('閉じる',X+BW-cw-3,Y+9,10,'#9fb6c4');
  hs(X+BW-cw-8,Y+6,cw,17,()=>{overlay=null; dexSel=null;});
}

/* --- 記録（測る仕組み・画面から見る形） ---------------------------------- */
function drawRecOverlay(){
  const W=cv.width, H=cv.height, P=PLACES[S.place];
  // **中身のぶんだけの高さにする。**余白が下に残ると、作りかけに見える
  const X=16, BH=248, Y=Math.floor((H-BH)/2), BW=W-32;
  ctx.globalAlpha=0.86; box(0,0,W,H,'#04080a'); ctx.globalAlpha=1;
  box(X,Y,BW,BH,'#0a1216','#2f4a56');
  ctx.fillStyle=dim(P.glow,0.35); ctx.fillRect(X,Y,BW,1);
  txt('記録', X+12, Y+8, 15, lit(P.glow,0.35));
  txt('この周', X+52, Y+11, 11, '#7d919c');
  const sec = (performance.now()-S.rec.t0)/1000;

  /* 数字を三つの塊に分ける。**まず大きい三つ、次に細かいもの。**
     並べただけの一覧だと、どれがいま見るべき数字か分からない */
  const big = [
    ['稼ぎ', yen(S.rec.earn), lit(P.glow,0.3)],
    ['投げた回数', S.rec.casts+'／'+castTarget(S.run), '#e8eef2'],
    ['転生でもらえる量', String(presGain(S.rec.earn)), '#7fd6a0'],
  ];
  big.forEach(([k,v,c],i)=>{
    const bw=(BW-32)/3, bx=X+12+i*bw;
    box(bx, Y+32, bw-8, 46, '#0b151a', '#22333c');
    ctx.fillStyle = c; ctx.fillRect(bx+1, Y+33, T.uiBarW, 44);
    txt(k, bx+T.uiBarW+8, Y+38, 10, '#7d919c');
    txt(v, bx+T.uiBarW+8, Y+52, 17, c);
  });

  // 腕（割合）。**帯で出す。**三つの数字を並べるより、比が先に見える
  {
    const n = S.rec.perfect+S.rec.soso+S.rec.missed;
    const by = Y+90, bw = BW-24;
    txt('完璧／そこそこ／逃す', X+12, by, 10, '#7d919c');
    txt(ratioStr(), X+BW-12, by, 10, '#9fb6c4', 'right');
    box(X+12, by+14, bw, 8, '#111d24', '#22333c');
    if (n){
      const seg=[[S.rec.perfect,'#7fd6a0'],[S.rec.soso,'#c8a94a'],[S.rec.missed,'#a05a52']];
      let sx=X+13;
      for (const [v,c] of seg){ const w=(bw-2)*v/n; ctx.fillStyle=c;
        ctx.fillRect(sx, by+15, w, 6); sx+=w; }
    }
  }
  // 格ごとの内訳。**釣った中身が見える**
  {
    const gy = Y+118, bw = BW-24;
    const tot = S.rec.byGrade.reduce((a,b)=>a+(b||0),0);
    txt('格ごと', X+12, gy, 10, '#7d919c');
    txt(tot+'匹', X+BW-12, gy, 10, '#9fb6c4', 'right');
    box(X+12, gy+14, bw, 8, '#111d24', '#22333c');
    let sx=X+13;
    const gc=['#4a6b7a','#5f8a7a','#8fa05a','#c8a94a','#e8c05a'];
    GRADES.forEach((g,i)=>{ const v=S.rec.byGrade[i]||0; if(!tot) return;
      const w=(bw-2)*v/tot; ctx.fillStyle=gc[i]; ctx.fillRect(sx, gy+15, w, 6); sx+=w; });
    let lx=X+12;
    GRADES.forEach((g,i)=>{
      ctx.fillStyle=gc[i]; ctx.fillRect(lx, gy+28, 7, 7);
      txt(g+' '+(S.rec.byGrade[i]||0), lx+10, gy+27, 9, '#7d919c');
      ctx.font='9px monospace';
      lx += 10+ctx.measureText(g+' '+(S.rec.byGrade[i]||0)).width+14;
    });
  }
  // 細かいもの。二列
  {
    const L = [
      ['周', S.run+'周目'],
      ['所要時間', fmtSec(sec)],
      ['連続の最高', String(bestComboRun)],
      ['通しの時間', fmtSec(S.totalSec+sec)],
      ['解放したもの', S.rec.unlocked.length? S.rec.unlocked.join('、') : '（なし）'],
      ['クリア', S.cleared ? S.clearRun+'周目／'+fmtSec(S.clearSec) : '（まだ）'],
    ];
    const cw=(BW-24)/2;
    L.forEach((r,i)=>{
      const c=i%2, rr=Math.floor(i/2);
      const x=X+12+c*cw, y=Y+168+rr*20;
      txt(r[0], x, y, 10, '#5b6d78');
      txt(r[1], x+92, y, 11, '#c9d6dc');
    });
  }
  /* 最初から。**画面の中から触れるところに置く**（横のパネルはスマホで届かない）。
     **二段にする** ── 一段だと、触っただけで消える */
  {
    const by = Y+BH-26;
    if (!resetArmed()){
      box(X+12, by, 78, 18, '#141d23', '#33262a');
      txt('最初から', X+18, by+3, 10, '#8a6f6c');
      hs(X+12, by, 78, 18, ()=>{ resetArm = performance.now()/1000; });
    } else {
      txt('所持金・図鑑・転生・つまみを全部消します', X+12, by+4, 10, '#e0736b');
      box(X+BW-150, by, 66, 18, '#2a1c1c', '#7a3a34');
      txt('消す', X+BW-134, by+3, 10, '#e0736b');
      hs(X+BW-150, by, 66, 18, ()=>resetAll());
      box(X+BW-78, by, 66, 18, '#16262e', '#2f4a56');
      txt('やめる', X+BW-66, by+3, 10, '#9fb6c4');
      hs(X+BW-78, by, 66, 18, ()=>{ resetArm = 0; });
    }
  }
  const cw2=46; box(X+BW-cw2-8,Y+6,cw2,17,'#16262e','#2f4a56');
  txt('閉じる',X+BW-cw2-3,Y+9,10,'#9fb6c4');
  hs(X+BW-cw2-8,Y+6,cw2,17,()=>overlay=null);
}
function ratioStr(){
  const n = S.rec.perfect+S.rec.soso+S.rec.missed;
  if (!n) return '—';
  const p=x=>(x/n*100).toFixed(1)+'%';
  return p(S.rec.perfect)+'／'+p(S.rec.soso)+'／'+p(S.rec.missed);
}

/* ---------------------------------------------------------------------------
   横のパネル：つまみ（分類してたためる）／記録／セーブ
   ------------------------------------------------------------------------- */
const side = document.getElementById('side');
function mkBox(title, closed){
  const b=document.createElement('div'); b.className='box'+(closed?' closed':'');
  const h=document.createElement('h3'); h.innerHTML='<span>'+title+'</span><span class="caret">▾</span>';
  const d=document.createElement('div');
  h.onclick=()=>b.classList.toggle('closed');
  b.appendChild(h); b.appendChild(d); side.appendChild(b); return d;
}
function buildTuner(){
  side.innerHTML='';

  // 操作の説明
  const g = mkBox('操作', false);
  g.innerHTML = '<div class="hint">'
    + '押す＝スペース／Z／クリック。<b>単押し</b>と<b>押しっぱなし</b>の二種類だけ。<br>'
    + '待っているあいだに押すと投げる。符号の上に光の線が来たら押す。<br>'
    + '短点（■）は単押し、長点（▬）は押しっぱなし。</div>';

  // 記録
  const rec = mkBox('記録（まとめて書き出す）', false);
  const recPre = document.createElement('pre'); recPre.id='recpre';
  const rb = document.createElement('div'); rb.className='btnrow';
  rb.innerHTML = '<button id="rcTsv">TSVを出す</button><button id="rcJson">JSONを出す</button>'
               + '<button id="rcCopy">選択用に表示</button>';
  rec.appendChild(rb); rec.appendChild(recPre);
  const recTbl = document.createElement('div'); recTbl.id='rectbl'; rec.appendChild(recTbl);

  // セーブ
  const sv = mkBox('セーブ（10.5章）', true);
  sv.innerHTML =
    '<div class="btnrow"><button id="svSave">いま保存</button><button id="svLoad">読み込む</button>'
    + '<button id="svExp">書き出し</button><button id="svImp">読み込み（文字列）</button>'
    + '<button id="svReset">最初から</button></div>'
    + '<textarea id="svBox" style="width:100%;height:70px;background:#0a1216;color:#e8eef2;'
    + 'border:1px solid #2b3b46;font-size:10px"></textarea>';

  // つまみ（10章の分類ごと）
  const groups = [];
  for (const [id,gp,label,,ty] of TUNE_DEF){ if(!groups.includes(gp)) groups.push(gp); }
  for (const gp of groups){
    const d = mkBox('つまみ｜'+gp, true);
    for (const [id,g2,label,,ty] of TUNE_DEF){
      if (g2!==gp) continue;
      const row=document.createElement('div'); row.className='row';
      const lab=document.createElement('label'); lab.textContent=label; row.appendChild(lab);
      const inp=document.createElement('input');
      if (ty==='b'){ inp.type='checkbox'; inp.checked=!!T[id];
        inp.onchange=()=>{ T[id]=inp.checked?1:0; onTuneChange(id); };
      } else { inp.type='number'; inp.step='any'; inp.value=T[id];
        inp.onchange=()=>{ const v=parseFloat(inp.value); if(!isNaN(v)){ T[id]=v; onTuneChange(id);} };
      }
      inp.id='tune_'+id; row.appendChild(inp); d.appendChild(row);
    }
  }
  const rst = mkBox('つまみを初期値に戻す', true);
  rst.innerHTML='<div class="btnrow"><button id="tnReset">10章の初期値に戻す</button></div>'
    + '<div class="hint">10章の値に戻します。</div>';

  document.getElementById('tnReset').onclick=()=>{
    for (const [id,,,v] of TUNE_DEF) T[id]=v; syncTunerInputs(); fitCanvas(); bgmStart();
  };
  document.getElementById('svSave').onclick=()=>{ const a=T.autoSave; T.autoSave=1; save(); T.autoSave=a; note('保存した'); };
  document.getElementById('svLoad').onclick=()=>{ if(load()) { syncTunerInputs(); fitCanvas(); note('読み込んだ'); } };
  document.getElementById('svExp').onclick=()=>{ document.getElementById('svBox').value=exportStr(); };
  document.getElementById('svImp').onclick=()=>{
    if (importStr(document.getElementById('svBox').value)){ syncTunerInputs(); fitCanvas(); note('読み込んだ'); }
    else note('読み込めなかった');
  };
  /* 横のパネルのほうも二段にする。**一段だと、触っただけで消えていた** */
  {
    const b = document.getElementById('svReset');
    b.onclick = () => {
      if (!resetArmed()){
        resetArm = performance.now()/1000;
        b.textContent = '本当に消す？';
        setTimeout(()=>{ if(!resetArmed()) b.textContent='最初から'; }, T.resetArmSec*1000+50);
      } else {
        resetArm = 0; b.textContent = '最初から'; resetAll();
      }
    };
  }
  document.getElementById('rcTsv').onclick =()=>{ recPre.textContent = recTsv(); };
  document.getElementById('rcJson').onclick=()=>{ recPre.textContent = JSON.stringify(recAll(),null,1); };
  document.getElementById('rcCopy').onclick=()=>{ recPre.textContent = recTsv(); recPre.focus(); };
}
function onTuneChange(id){
  if (id==='scrW'||id==='scrH') fitCanvas();
  if (id==='bgmOn'||id==='sndOn') { bgmStop(); bgmStart(); }
  if (id==='sndVol' && master) master.gain.value=T.sndVol;
  save();
}
function syncTunerInputs(){
  for (const [id,,,,ty] of TUNE_DEF){
    const e=document.getElementById('tune_'+id); if(!e) continue;
    if (ty==='b') e.checked=!!T[id]; else e.value=T[id];
  }
}

/* --- 測る仕組み：まとめて書き出せる形 ------------------------------------ */
function recAll(){
  const cur = {...S.rec, sec:(performance.now()-S.rec.t0)/1000, bestCombo:bestComboRun,
               presGot:presGain(S.rec.earn), 進行中:true};
  return {
    通し:{周数:S.run, 総時間秒:S.totalSec+cur.sec, 図鑑:dexCount()+'/'+dexTotal(),   // **直書きしない**（5章は72種）
          クリア周:S.cleared?S.clearRun:null, クリア総時間秒:S.cleared?S.clearSec:null},
    周ごと:[...S.history, cur].map(r=>({
      周:r.no, 所要秒:+(r.sec||0).toFixed(1), 目標投数:castTarget(r.no),
      投数:r.casts, 雑魚:r.byGrade[0], 並:r.byGrade[1], 良型:r.byGrade[2],
      大物:r.byGrade[3], 超大物:r.byGrade[4],
      稼ぎ:r.earn, 転生でもらった量:r.presGot,
      完璧:r.perfect, そこそこ:r.soso, 逃す:r.missed,
      完璧率:pct(r.perfect,r), そこそこ率:pct(r.soso,r), 逃す率:pct(r.missed,r),
      連続の最高:r.bestCombo, 解放:(r.unlocked||[]).join('｜'),
    })),
  };
}
function pct(x,r){ const n=r.perfect+r.soso+r.missed; return n? +(x/n*100).toFixed(1) : 0; }
function recTsv(){
  const a = recAll(); const rows = a.周ごと;
  if (!rows.length) return '';
  const keys = Object.keys(rows[0]);
  const head = keys.join('\t');
  const body = rows.map(r=>keys.map(k=>r[k]).join('\t')).join('\n');
  const t = a.通し;
  return head+'\n'+body+'\n\n通し\t周数 '+t.周数+'\t総時間秒 '+t.総時間秒.toFixed(1)
       +'\t図鑑 '+t.図鑑+'\tクリア周 '+(t.クリア周??'-')
       +'\tクリア総時間秒 '+(t.クリア総時間秒? t.クリア総時間秒.toFixed(1):'-');
}
function refreshRecTable(){
  const el = document.getElementById('rectbl'); if(!el) return;
  const rows = recAll().周ごと.slice(-8);
  let h='<table><tr><th>周</th><th>所要</th><th>目標</th><th>投</th><th>稼ぎ</th>'
      + '<th>転生</th><th>完/そ/逃</th><th>連続</th></tr>';
  for (const r of rows){
    h+='<tr><td>'+r.周+'</td><td>'+fmtSec(r.所要秒)+'</td><td>'+r.目標投数+'投</td>'
     + '<td>'+r.投数+'</td><td class="l">'+yen(r.稼ぎ)+'</td><td>'+r.転生でもらった量+'</td>'
     + '<td>'+r.完璧+'/'+r.そこそこ+'/'+r.逃す+'</td><td>'+r.連続の最高+'</td></tr>';
  }
  el.innerHTML = h+'</table>';
}

/* ---------------------------------------------------------------------------
   起動
   ------------------------------------------------------------------------- */
document.getElementById('help').textContent =
  '押す＝スペース／Z／クリック。単押しと押しっぱなしの二種類だけ。';
buildTuner();
if (!load()) { S = newState(); }
syncRods(); fitCanvas(); bgmStart();

let recTick=0;
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  update(dt);
  draw();
  recTick += dt;
  if (recTick>0.5){ recTick=0; refreshRecTable(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
