<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>釣りインクリメンタル（仮題）／第一段</title>
<style>
  :root{
    --ink:#e8eef2; --dim:#8fa3b0; --line:#2b3b46; --bg:#0d1418; --panel:#121e25;
    --gold:#e8c05a; --good:#7fd6a0; --bad:#e0736b; --mid:#9fb6c4;
  }
  *{box-sizing:border-box}
  /* 長押しで画面が動く・選択の吹き出しが出ると、押しっぱなしが途切れる */
  canvas{touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",monospace,sans-serif;
    font-size:13px;line-height:1.5}
  #wrap{display:flex;gap:10px;padding:10px;align-items:flex-start;flex-wrap:wrap}
  #stage{position:relative;flex:0 0 auto}
  canvas{display:block;background:#000;image-rendering:pixelated;border:1px solid var(--line)}
  .side{flex:1 1 320px;min-width:300px;max-width:520px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
  .box>h3{margin:0;padding:6px 8px;font-size:12px;background:#18272f;border-bottom:1px solid var(--line);
    cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center}
  .box>h3 .caret{color:var(--dim)}
  .box>div{padding:6px 8px;max-height:420px;overflow:auto}
  .box.closed>div{display:none}
  .row{display:flex;align-items:center;gap:6px;padding:1px 0}
  .row label{flex:1 1 auto;color:var(--dim);font-size:11px;min-width:0;overflow-wrap:anywhere}
  .row input[type=number]{width:96px;background:#0a1216;color:var(--ink);border:1px solid var(--line);
    border-radius:3px;padding:2px 4px;font-family:inherit;font-size:11px;text-align:right}
  .row input[type=checkbox]{width:14px;height:14px}
  button{background:#1d2f39;color:var(--ink);border:1px solid var(--line);border-radius:3px;
    padding:4px 8px;font-family:inherit;font-size:11px;cursor:pointer}
  button:hover{background:#27404d}
  button:disabled{opacity:.4;cursor:default}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
  table{border-collapse:collapse;width:100%;font-size:11px}
  th,td{border:1px solid var(--line);padding:2px 4px;text-align:right}
  th{background:#18272f;color:var(--dim);text-align:center}
  td.l,th.l{text-align:left}
  pre{white-space:pre-wrap;word-break:break-all;background:#0a1216;border:1px solid var(--line);
    padding:6px;font-size:10px;max-height:200px;overflow:auto;margin:4px 0}
  .hint{color:var(--dim);font-size:11px;margin:2px 0}
  .gold{color:var(--gold)} .good{color:var(--good)} .bad{color:var(--bad)} .mid{color:var(--mid)}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="help"></div>
  </div>
  <div class="side" id="side"></div>
</div>

  if (pk.type==='inf')  return pk.id==='infCool' ? T.infCoolMax : T.infRodMax;
  return 1;

  let c = S.rec.byGrade.reduce((a,b)=>a+b,0);
  for (const h of S.history) c += (h.byGrade||[]).reduce((a,b)=>a+b,0);
  return c;
}
function lifeCombo(){                      // 通しの最高連続
  let c = bestComboRun;
  for (const h of S.history) c = Math.max(c, h.bestCombo||0);

const pow = (b,e)=>Math.pow(b,e);

function toolGrow(t){
  if (t==='rod')  return has('pkRod1') ? T.pkRod1v : T.rodGrow;

}
function toolBase(t){
  return T[{rod:'rodCost',bait:'baitCost',line:'lineCost',reel:'reelCost',cool:'coolCost'}[t]];
}
function toolPrice(t){ return toolBase(t) * pow(toolGrow(t), S.tools[t]); }

function baitEff(){ return has('pkBait3') ? T.pkBait3v : has('pkBait1') ? T.pkBait1v : T.baitEff; }
function lineEff(){ return T.lineEff; }
function reelEff(){ return has('pkReel1') ? T.pkReel1v : T.reelEff; }
// クーラー一段の効きは動かさない（10章10）。伸びは売値の恒久倍率で作る
function coolEff(){ return T.coolEff; }

function deepMult(p){                                   // p は 0..7
  return [T.deep12,T.deep12,T.deep34,T.deep34,T.deep56,T.deep56,T.deep78,T.deep78][p];
}
// 判定の幅（ミリ秒）。基準 × リール(複利) × 深場倍率、天井で頭打ち
/* 所持数の節目（7章・10章7）。**その道具の効きが、節目ごとに倍になる。**
   相場：AdVenture Capitalist は **25 と 50 で ×2（積み上がる）**、
   Cookie Clicker は **1 / 5 / 25 / 50 / 100 / 150 / 200** で倍
   （gamedev/references/incremental-2026-08-20.md 5-1・3-4）。
   **転生通貨を使わない。周の中で起きる。**
   これが 5-4 の「**下の層を買う意味を残す**」への答えでもある。 */
function msSteps(){ return [T.ms1, T.ms2, T.ms3, T.ms4]; }
function milestone(id){
  const n = S.tools[id]||0;
  let m = 1;
  for (const st of msSteps()) if (n >= st) m *= T.msMult;
  return m;
}
function msNext(id){                       // 次の節目まで、あと何段か。無ければ null
  const n = S.tools[id]||0;
  for (const st of msSteps()) if (n < st) return {at:st, left:st-n};
  return null;
}
function windows(){
  const r = pow(1+reelEff(), S.tools.reel) * milestone('reel'), d = deepMult(S.place);
  // 基準 × 深場倍率 × リール（複利）。天井は最後にかける
  let hit = T.winHit  * d * r * (has('pkReel3') ? (1+T.pkReel3v) : 1);
  let grz = T.winGraze * d * r;
  hit = Math.min(hit, T.capHit);
  grz = Math.min(grz, T.capGraze);
  return {hit, graze: Math.max(grz, hit)};
}
/* 「逃す」になる外しの割合（10章「効果の天井」）。
   **道具だけなら8割。パーク「もう逃さない」で10割になり、そこで完結する。**
   自動の竿にも及ぶのは「自動の竿も逃さなくなる」を取ってから。 */
function missRatio(auto){
  if (has('pkLineAll') && (!auto || has('pkLineAuto'))) return 1;
  return Math.min(T.missRatio0 * pow(1+lineEff(), S.tools.line) * milestone('line'), T.capMiss);
}
function waitRange(){
  const f = pow(1-baitEff(), S.tools.bait) / milestone('bait');
  // 「入れ食いになる」を取ると床が緩む（開く型11）
  const floorLo = has('opn11') ? T.opn11v : T.capWaitLo;
  const lo = Math.max(floorLo, T.waitLo*f);
  const hi = Math.max(lo, T.waitHi*f);
  return {lo,hi};
}
function dexCount(){ let c=0; for(const r of S.dex) for(const b of r) if(b) c++; return c; }
function dexTotal(){ let c=0; for(const r of FISH) c+=r.length; return c; }
function placeAllCaught(p){ return S.dex[p].every(Boolean); }
// 無限段（10章10）。値段 = 初期値 × 伸び率^段数、効果 = 効果の伸び率^段数
function infPrice(axis){
  const n = (S.inf&&S.inf[axis])||0;
  return axis==='cool' ? T.infCoolBase*pow(T.infCoolGrow,n) : T.infRodBase*pow(T.infRodGrow,n);
}
function infCoolMult(){ return pow(T.infCoolEff, (S.inf&&S.inf.cool)||0); }
// 自動の竿の本数（10章10の式）。0段は0本、一段ごとに必ず1本は増える
function infRodCountAt(n){
  if (n<=0) return 0;
  return Math.max(n, Math.floor(pow(T.infRodEff, n)));   // 一段ごとに必ず1本は増える
}
function infRodCount(){
  const n = (S.inf&&S.inf.rod)||0;
  return infRodCountAt(n);
}
// 図鑑を揃えたか（クラーケン以外の71種）。揃うと恒久倍率が一段跳ねる
function dexDone(){
  for (let p=0;p<8;p++) for (let k=0;k<9;k++){
    if (p===7 && k===8) continue;          // クラーケンは除く
    if (!S.dex[p][k]) return false;
  }
  return true;
}
function sellMult(){
  let m = pow(1+coolEff(), S.tools.cool) * milestone('cool') * infCoolMult();
  if (dexDone()) m *= T.dexDoneMult;
  if (has('opn8')) m *= (1 + T.opn8v*dexCount());
  if (has('opn7') && placeAllCaught(S.place)) m *= (1 + T.dexAllBonus);
  return m;
}
function perfectMult(){ return T.perfectMult + (has('pkCool3') ? T.pkCool3v : 0); }
function comboMult(){
  return Math.min(T.comboBase + T.comboStep*Math.max(0,combo-1), T.comboMax);
}
// 10章10：そこそこが出る確率 ＝ 天井 −（天井 − 初期）× 寄る速さ^段数
function autoAccAt(n){
  return T.autoAccCap - (T.autoAccCap - T.autoAcc0)*pow(T.autoAccDecay, n);
}
function autoAcc(){
  // **竿（精度）の段数式ひとつに寄せた（決・第35版）。**
  // 10章11 の表（周13・17）が「竿の精度3段目／7段目」を指しているので、
  // 開く型2・3（自動の精度1段目・2段目）は古い設計の残りだった。落とした
  let a = autoAccAt(tierOf('rodAcc'));
  return Math.min(a, 0.999);        // 手動を上回らない（100%未満）
}
/* **所持数の節目を、竿には掛けない（決・第34版）。**
   他の四つが掛かるのは**天井のある効き**（判定の幅・待ち時間・逃す割合）か売値だが、
   **竿だけは「投数」そのものを掛け算する。**投数が増えると手動が薄まる。
   実測：竿40段で×4、80段で×8。**一秒あたり55投**になり、人が押す隙が無くなった。 */
function autoRodCount(){ return S.tools.rod + infRodCount(); }
/* 持ち越し（7章・10章10）。**持ち越せるものは六つ**（道具5種と所持金）。
   枠は 0段で0枠、1段で1枠…5段で6枠。 */
/* **0段で0枠、6段で6枠（決・第35版）。**
   相場：Cookie Clicker の持ち越し枠は **"Five purchasable slots exist (I through V)"** で、
   **無料の枠は一つも無い**（`gamedev/references/incremental-perks.md` A-8）。
   仕様書の「上限6（持ち越せるものが六つしかない）」に届かせるため、**段数を5→6にした。**
   第34版までは「0段で1枠、5段で6枠」で、**取る前に一つ無料で持ち越せた。** */
function carrySlots(){ return Math.min(TOOLS.length+1, tierOf('carSlot')); }
// 引継ぎ割合＝基準の割合 × 一段あたりの倍率^段数。**上限は10割**
function carryRate(baseKey){
  return Math.min(1, T[baseKey] * pow(T.carKeepMult, tierOf('carKeep')));
}
function omenRate(){ return has('opn10') ? T.omenRate2 : T.omenRate; }
function unitPrice(p,g){
  const base=[T.price0,T.price1,T.price2,T.price3,T.price4][g];
  const mul =[T.placeMul1,T.placeMul2,T.placeMul3,T.placeMul4,
              T.placeMul5,T.placeMul6,T.placeMul7,T.placeMul8][p];
  return base*mul;
}
function moveCost(p){ return [0,T.move2,T.move3,T.move4,T.move5,T.move6,T.move7,T.move8][p]; }
function nextPlace(){ return S.place+1 <= 7 ? S.place+1 : -1; }
/* 転生通貨（9章）。**通しの累計で出す（決）。**
   相場は四本あり、二つに割れる（references 5-3、Pecorella "The Math of Idle Games III"）。

     累計型  Cookie Clicker  p = ∛(累計/10^12)      … 倍にするには前回の8倍
             AdVenture Cap.  p = 150·√(累計/10^15)
     ラン型  Egg, Inc.       Δp = (この周の稼ぎ/10^6)^0.14 … 倍にするには128倍

   > **lifetime 基準は継続的な前進を促す。
   >   run 基準は決まった地点での稼ぎ直しが成立する。**

   **第一段はラン型だった。**測ると、同じ地点で切り直すのがいちばん得になり、
   **一周13〜18投で87〜103周**という形になった（目標は35〜50投・25周）。
   **これはラン型が持っている性質そのもので、値では直らない。**
   累計型に替える。**同じ地点で切っても累計が増えていないので、通貨は増えない。** */
function presTotal(life){ return Math.floor(pow(Math.max(0,life)/T.presDiv, T.presExp)); }
function presGain(earn){
  const life = (S.lifeEarn||0) + Math.max(0, earn);
  return Math.max(0, presTotal(life) - presTotal(S.lifeEarn||0));
}
// その周の目標投数（10章11）。導入だけ短い
function castTarget(no){ return no===1 ? T.castTarget1 : T.castTarget; }
function bossReady(p){ return has('opn7') && S.dex[p].slice(0,8).every(Boolean); }

/* 2章 桁の表記：日本語の桁は使わない。15桁までは全部数字、16桁から指数表記 */
function yen(v){
  v = Math.floor(v);
  if (!isFinite(v)) return '∞円';
  const s = Math.abs(v).toString();
  if (s.length <= 15) return v.toLocaleString('en-US')+'円';
  return v.toExponential(3).replace('e+','e')+'円';
}
/* 短い形。**札の中のように、幅が決まっているところで使う。**
   桁を落とすので、正確さが要るところ（所持金・値段の判定）には使わない */
function yenShort(v){
  v = Math.floor(v);
  if (!isFinite(v)) return '∞円';
  for (const [u,n] of [['兆',1e12],['億',1e8],['万',1e4]]){
    if (Math.abs(v) >= n){
      const x = v/n;
      return (x>=100 ? Math.round(x) : +x.toFixed(x>=10?1:2))+u+'円';
    }
  }
  return v.toLocaleString('en-US')+'円';
}
function digitsOf(v){ return Math.max(1, Math.floor(v)<=0?1:Math.floor(v).toString().length); }

/* ---------------------------------------------------------------------------
   音（11章）。外部ファイルを使わず合成する
   ------------------------------------------------------------------------- */
let AC=null, master=null, bgmNode=null, omenNode=null;
function audio(){
  if (!AC){ AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = T.sndVol; master.connect(AC.destination); }
  if (AC.state==='suspended') AC.resume();
  master.gain.value = T.sndVol;
  return AC;
}
function beep(freq, dur, type, vol){
  if (!T.sndOn) return;
  const ac = audio();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, ac.currentTime);
  g.gain.linearRampToValueAtTime(vol==null?0.6:vol, ac.currentTime+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+dur+0.02);
}
/* 11章 旋律の一音。長音は押しているあいだ伸ばし、離すと止める（8章0） */
const MEL_WAVE = ['square','triangle','sawtooth'];
let melVoice = null;
function melStop(){
  if (!melVoice) return;
  const ac = audio(), g = melVoice.g, o = melVoice.o, t = ac.currentTime;
  const rel = Math.max(0.01, T.melRel/1000);
  g.gain.cancelScheduledValues(t);
  g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+rel);
  o.stop(t+rel+0.02); melVoice = null;
}
function melPlay(step, hold){
  if (!T.sndOn) return;
  melStop();
  const ac = audio(), o = ac.createOscillator(), g = ac.createGain();
  o.type = MEL_WAVE[Math.max(0,Math.min(2, Math.round(T.melWave)))] || 'square';
  o.frequency.value = melHz(step);
  const t = ac.currentTime, atk = Math.max(0.0005, T.melAtk/1000);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, T.tapVol), t+atk);
  o.connect(g); g.connect(master); o.start(t);
  if (hold){ melVoice = {o,g}; return; }              // 離すまで伸ばす
  const dec = Math.max(0.005, T.melDec/1000);
  g.gain.exponentialRampToValueAtTime(0.0001, t+atk+dec);
  o.stop(t+atk+dec+0.02);
}
function omenSound(on){
  if (!T.sndOn){ on=false; }
  if (on && !omenNode){
    const ac=audio(); const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=70; g.gain.value=0.25;   // 低くて持続する音
    o.connect(g); g.connect(master); o.start(); omenNode={o,g};
  } else if(!on && omenNode){ omenNode.o.stop(); omenNode=null; }
}
let bgmTimer=null, bgmStep=0;
const BGM_SCALE = [[0,2,4,7,9],[0,3,5,7,10],[0,2,5,7,9],[0,4,7,9,11],
                   [0,1,5,7,8],[0,2,3,7,8],[0,1,3,6,8],[0,2,3,5,8]];
function bgmStart(){
  bgmStop();
  if (!T.bgmOn || !T.sndOn) return;
  const sc = BGM_SCALE[S.place], root = 110*Math.pow(2,(S.place%4)/12);
  bgmTimer = setInterval(()=>{
    if (!T.bgmOn || !T.sndOn) return;
    const n = sc[(bgmStep*3)%sc.length] + 12*((bgmStep>>2)%2);
    beep(root*Math.pow(2,n/12), 0.28, 'triangle', 0.10);
    bgmStep++;
  }, 420);
}
function bgmStop(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }

/* ---------------------------------------------------------------------------
   譜面
   ------------------------------------------------------------------------- */
function chartFor(place, grade){
  if (grade===4) return BOSS_CHART[place];
  const need = SYM_COUNT[place][grade];
  const cand = POOL.filter(c=>c.length===need);
  return cand[(Math.random()*cand.length)|0];
}
// 実効の一拍。つまみ「拍の速さ（倍）」で一拍を割る。1.0 で仕様書どおり
function beatSec(){ return T.beat / Math.max(0.1, T.beatRate); }
// 枠の拍数は導出値。上限8符号 × 長音2拍 ＝ 16拍（3章）
function frameBeats(){ return T.maxSyms * T.dashBeats; }
// 帯の全体（カウントイン込み）の秒数。符号数によらず一定
function bandSec(){ return beatSec() * (T.countInBeats + frameBeats()); }

// 譜面 -> 各符号の {start, dur, long}（秒）。16拍の格子に置き、余り拍を間隔に配る
/* 11章 旋律。**譜面の並びだけから決める。間隔は使わない。**
   3章が「間隔も毎回ランダムに振り直す」と決めているので、間隔から音を決めると
   同じ譜面でも毎回ちがう旋律になってしまう。並びだけなら、**同じ譜面はいつも同じ旋律**。
   音階の端では折り返す（頭打ちにすると同じ音が続く） */
function melodyOf(chartIn){
  // **譜面は文字列でも配列でも来る。**timeline() は文字列を受け取る（castRod）ので、
  // ここで必ず配列に直す。直さないと文字列に .map が無くて落ちる
  const chart = [...chartIn];
  const top = MEL_RATIO.length-1;
  // 0=譜面の形で決まる／1=押すたびに昇る（10章「旋律の決め方」）
  if (Math.round(T.melMode) === 1)
    return chart.map((_,i)=>Math.min(i, top));
  const out = []; let k = 3;                            // 真ん中から始める
  for (let i=0;i<chart.length;i++){
    if (i>0){
      const long = chart[i]==='ー', prev = chart[i-1]==='ー';
      let step = long ? 3 : 2;
      if (prev) step -= 1;                               // 長音のあとは詰める
      if ((i + (prev?1:0)) % 2 === 1) step = -step;      // 一つおきに下げる
      k += step;
      while (k<0 || k>top) k = k<0 ? -k : 2*top-k;       // 端で折り返す
    }
    out.push(k);
  }
  return out;
}
function melHz(step){ return T.melBase * MEL_RATIO[Math.max(0,Math.min(MEL_RATIO.length-1,step))]; }

function timeline(chart, fixed){
  const b = beatSec(), n = chart.length;
  const vals = [...chart].map(ch => ch==='ー' ? T.dashBeats : T.dotBeats);
  const used = vals.reduce((a,x)=>a+x, 0);
  const slack = Math.max(0, frameBeats() - used);   // 余り拍
  const slots = n + 1;                              // 先頭・符号のあいだ・末尾
  const gaps = new Array(slots).fill(0);
  if (fixed){
    // 超大物：均等に配り、割り切れないぶんは先頭から1拍ずつ（毎回同じ並びになる）
    const q = Math.floor(slack/slots), r = slack % slots;
    for (let i=0;i<slots;i++) gaps[i] = q + (i<r ? 1 : 0);
  } else {
    // それ以外：1拍ずつランダムに配る。同じ場所に何拍でも置ける。0拍でよい
    for (let k=0;k<slack;k++) gaps[(Math.random()*slots)|0]++;
  }
  const out=[]; let t = b*(T.countInBeats + gaps[0]);
  for (let i=0;i<n;i++){
    out.push({start:t, dur:b*vals[i], long: chart[i]==='ー', ch: chart[i]});
    t += b*vals[i] + b*gaps[i+1];
  }
  return {syms:out, total: bandSec(), mel: melodyOf(chart)};   // 旋律は並びだけから（11章）
}
// 完璧で許される取りこぼしの個数（符号数ごと。割合ではない）
function slipAllow(n){
  return [0,0,T.slip2,T.slip3,T.slip4,T.slip5,T.slip6,T.slip7,T.slip8][Math.min(8,n)] || 0;
}

/* ---------------------------------------------------------------------------
   竿。0番が自分の竿（手動・最後まで一本）。1番以降が自動の竿
   ------------------------------------------------------------------------- */
function newRod(auto){
  return {auto, phase:'idle', t:0, wait:0, grade:0, chart:'', tl:null,
          idx:0, res:[], holding:false, pressT:-1, aim:-1, omen:false, popT:0, last:null};
}
function syncRods(){
  const want = 1 + (scr==='A' ? autoRodCount() : 0);
  while (rods.length < want) rods.push(newRod(rods.length>0));
  while (rods.length > want) rods.pop();
  if (rods.length) rods[0].auto = false;
}
function pickGrade(){
  const w = [T.rate0,T.rate1,T.rate2,T.rate3].slice();
  if (has('opn9')) for (let g=0;g<4;g++) if (!GRADE_SLOTS[g].every(k=>S.dex[S.place][k])) w[g] *= T.opn9v;
  const sum = w.reduce((a,b)=>a+b,0);
  let r = Math.random()*sum;
  for (let g=0;g<4;g++){ r -= w[g]; if (r<=0) return g; }
  return 0;
}
function rollWait(){
  const {lo,hi} = waitRange();
  const u = Math.pow(Math.random(), Math.max(0.0001,T.waitSkew));   // 短いほうに寄せる
  return lo + (hi-lo)*u;
}
function castRod(r){
  /* **狙い（aim）も消す。**消していなかったので、前の投で掴んだ番号が残り、
     次の投でカウントイン中に連打すると、**押してもいない符号がその番号で外しになった** */
  r.phase='wait'; r.t=0; r.res=[]; r.idx=0; r.holding=false; r.pressT=-1; r.last=null;
  r.aim=-1;
  // 予兆は「時間」で来る（4章：竿を入れていなくても出る）。ここでは
  // 予兆が立っているかどうかだけを見る。自動の竿は予兆に関係しない
  r.omen = false;
  if (!r.auto && omenUp > 0 && bossReady(S.place)){
    r.omen = true; omenUp = 0; omenCool = T.omenGap;
    r.wait = T.omenWaitLo + Math.random()*(T.omenWaitHi-T.omenWaitLo);
    omenSound(false);
  } else if (r.auto && has('opn6') && bossReady(S.place) && Math.random() < T.autoBossRate){
    r.omen = true;
    r.wait = T.omenWaitLo + Math.random()*(T.omenWaitHi-T.omenWaitLo);
  }
  if (!r.omen) r.wait = rollWait();
  r.grade = r.omen ? 4 : pickGrade();
  r.chart = chartFor(S.place, r.grade);
  r.tl = timeline(r.chart);
  S.rec.casts++;
}
function startChart(r){
  r.phase='play'; r.t = 0; r.idx=0; r.res=[]; r.popT=0; r.bandT0=null; r.countIn=-1; r.extra=0;
  if (!r.auto) omenSound(false);
  if (r.auto) autoPlay(r);
}
// 自動の竿は「そこそこ」しか出せない。精度の確率でそこそこ、外れると逃す
function autoPlay(r){
  const ok = Math.random() < autoAcc();
  r.autoResult = ok ? 'soso' : 'miss';
}
/* 8章0「符号を押した」の返し。**判定は変えない。**見立てた段だけで鳴らし、光らせる */
function pressBack(grade, dtSec, mel, hold){
  // 旋律（11章）。**窓の外では鳴らさない。**鳴らないこと自体が返しになる（旋律に穴があく）
  if (T.melOn){
    if (mel != null) melPlay(mel, !!hold);
  } else if (grade !== 'miss' || mel != null){
    beep(T.tapHz, Math.max(0.005, T.tapMs/1000), 'square', T.tapVol);
  }
  edgeAt = performance.now()/1000;
  edgeKind = (grade==='miss') ? 'miss' : 'hit';
  if (T.dirOn && grade!=='hit'){
    dirMsg = dtSec < 0 ? '早い' : '遅い';              // 方向だけ。ミリ秒は出さない（8章0）
    dirUntil = edgeAt + Math.max(0.05, T.flashSec*2);
  }
}
/* 長音を早く離したときの返し。打鍵音は鳴らさない（押していないので）。
   「早く離した」は字が多くて画面で締まらないので `Early` の一語にする（8章0） */
function releaseBack(){
  edgeAt = performance.now()/1000;
  edgeKind = 'miss';
  if (T.dirOn){ dirMsg = 'Early'; dirUntil = edgeAt + Math.max(0.05, T.flashSec*2); }
}
function judgeSymbol(r, i, dt, kindOk){
  const w = windows();
  const a = Math.abs(dt)*1000;
  let g = (a<=w.hit && kindOk) ? 'hit' : (a<=w.graze && kindOk) ? 'graze' : 'miss';
  r.res[i] = g;
}
function finishChart(r){
  let result;
  if (r.auto){
    // 「自動の竿も逃さなくなる」を取ると、自動の外しも逃さない（10章の天井）
    result = (r.autoResult==='soso' || missRatio(true)>=1) ? 'soso' : 'miss';
  } else {
    const n = r.tl.syms.length;
    for (let i=0;i<n;i++) if (!r.res[i]) r.res[i]='miss';
    const extra = r.extra||0;                             // 余計に押した回数も外しに数える
    const mis = r.res.filter(x=>x==='miss').length + extra;
    const slip = n - r.res.filter(x=>x==='hit').length + extra;   // 取りこぼし＝当たり以外
    if (mis/n > missRatio(false))     result='miss';      // 境界は「超える」。ちょうどは許す
    else if (slip <= slipAllow(n))    result='perfect';
    else                              result='soso';
  }
  applyResult(r, result, false);
  r.phase='idle'; r.t=0;
}
function applyResult(r, result, saved){
  const g = r.grade;
  if (result==='miss'){
    if (!r.auto){ combo = 0; S.rec.missed++; beep(140,0.18,'sawtooth',0.4); }
    else S.rec.missed++;
    const ms = GRADE_SLOTS[g];
    r.last = {result, grade:g, money:0, saved, slot:ms[(Math.random()*ms.length)|0], isNew:false};
    fxAdd('miss', g, r);
    if (!r.auto) fxAdd('card', g, r);
    // **自動の竿は超大物の演出も音も出さない（9章の決）**
    if (g===4 && !r.auto) { fxAdd('hugeMiss', g, r); beep(90,0.5,'sawtooth',0.5); }
    return;
  }
  if (!r.auto){
    if (result==='perfect'){ combo++; if (combo>bestComboRun) bestComboRun=combo; S.rec.perfect++; }
    else S.rec.soso++;
  } else {
    S.rec.soso++;
  }
  let money = unitPrice(S.place, g) * sellMult();
  if (result==='perfect') money *= perfectMult() * comboMult();
  money = Math.floor(money);

  const before = digitsOf(S.money + creel);
  if (has('opn4')) S.money += money; else creel += money;
  const after = digitsOf(S.money + creel);

  S.rec.earn += money;
  S.rec.byGrade[g]++;
  const slots = GRADE_SLOTS[g];
  const slot = slots[(Math.random()*slots.length)|0];
  const isNew = !S.dex[S.place][slot];
  if (isNew){ S.dex[S.place][slot] = true; note('図鑑：'+FISH[S.place][slot]+' を記録'); }
  r.last = {result, grade:g, money, saved, slot, isNew};

  fxAdd(result==='perfect'?'perfect':'soso', g, r);
  // 釣果の札。**演出1（0.1秒）とは別の層で、演出1は止めない**（8章1）
  if (!r.auto) fxAdd('card', g, r);
  /* **超大物のカットインは、自動の竿からは出さない（9章の決）。**
     終盤の一周で自動は約150匹の超大物を上げるので、1.0秒の演出は入らない。
     **ただし新種のときだけ出す** ── 9章が新種に例外を認めているのと同じ理由で、
     **超大物の新種は通しで8回しかない**（GRADE_SLOTS[4] は釣り場ごとに一枠）。
     **音も同じ例外にする（決・第37版）。**自動を黙らせている理由は「数」で、
     通しで8回なら数の問題は起きない。**カットインだけ出て無音なのは、欠けて見える** */
  if (g===4 && (!r.auto || isNew)){ fxAdd('huge', g, r); beep(880,0.5,'square',0.8); }
  else if (!r.auto){
    const f = [520,620,740,900][g] || 520;
    beep(result==='perfect'? f*1.5 : f, result==='perfect'?0.16:0.10,
         result==='perfect'?'square':'triangle', result==='perfect'?0.7:0.4);
    if (result==='perfect' && combo>1) beep(f*1.5*Math.pow(2,Math.min(combo,12)/24),0.10,'square',0.4);
  }
  // 桁が変わった演出も、鳴らすのはプレイヤーの竿のときだけ（9章「自動の音は無し」）
  if (after>before){ fxAdd('digit', g, r); if (!r.auto) beep(1400,0.12,'sine',0.5); }
  save();
}
function sellAll(){
  if (creel<=0) return;
  S.money += creel; creel = 0; save();
}

/* ---------------------------------------------------------------------------
   演出（8章・13章）。「手を止める」ものだけ入力を止める
   ------------------------------------------------------------------------- */
function fxAdd(kind, grade, r){
  const now = performance.now()/1000;
  let dur=0, stop=false, text='';
  if (kind==='soso'||kind==='perfect'||kind==='miss'){
    dur = grade>=3 ? T.fxCatchBig : T.fxCatchSmall;
  } else if (kind==='digit'){ dur=T.fxDigit; text='桁'; }
  else if (kind==='place'){ dur=T.fxPlace; stop=true; text=PLACES[S.place].n; }
  else if (kind==='card'){ dur=T.fxCardSec; }
  else if (kind==='huge'){ dur=T.fxHuge; stop=true;
    text=FISH[S.place][(r&&r.last&&r.last.slot!=null)?r.last.slot:GRADE_SLOTS[4][0]]; }
  else if (kind==='hugeMiss'){ dur=T.fxHuge; stop=true; text='逃した'; }
  else if (kind==='auto'){ dur=T.fxAuto; stop=true; text='自動化'; }
  else if (kind==='prestige'){ dur=T.fxPrestige; stop=true; text='転生'; }
  fx.push({kind, grade, until:now+dur, dur, text, rod:r||null, born:now});
  if (stop) blockUntil = Math.max(blockUntil, now+dur);
}
function note(s){ toast.push({s, until:performance.now()/1000+2.5}); }

/* ---------------------------------------------------------------------------
   秒あたりの稼ぎの目安（9章 画面A）。
   **腕は勘定に入れない。**人によって違うので、入れると比べられなくなる。
   格の出現率で単価をならし、一投の秒数で割る。自動の竿はそこそこ止まりで足す。
   ------------------------------------------------------------------------- */
function rateEst(){
  const w = [T.rate0,T.rate1,T.rate2,T.rate3], sum = w.reduce((a,b)=>a+b,0);
  let unit = 0;
  for (let g=0; g<4; g++) unit += (w[g]/sum) * unitPrice(S.place, g);
  const wr = waitRange();
  const sec = (wr.lo + wr.hi)/2 + bandSec() + T.fxCatchSmall;
  const rodN = 1 + autoRodCount() * autoAcc();
  return unit * sellMult() * rodN / sec;
}
// その道具を一段買ったら、秒あたりの稼ぎが何倍になるか
function rateIfBuy(tool){
  const keep = S.tools[tool];
  S.tools[tool] = keep + 1;
  const after = rateEst();
  S.tools[tool] = keep;
  const now = rateEst();
  return now > 0 ? after/now : 1;
}
// 道具屋の一行に出す「いま → 買った後」（9章）
function toolEff(item){
  if (item.kind === 'move') return PLACES[item.id].n+' が開く';
  const t = item.id, keep = S.tools[t];
  const sample = f => { S.tools[t] = keep+1; const a = f(); S.tools[t] = keep; return a; };
  let now, next, label;
  if (t === 'bait'){
    label = '待ち';
    const a = waitRange(), b = sample(waitRange);
    now = a.lo.toFixed(1)+'〜'+a.hi.toFixed(1)+'秒'; next = b.lo.toFixed(1)+'〜'+b.hi.toFixed(1)+'秒';
  } else if (t === 'line'){
    label = '許される外し'; now = pc(missRatio(false)); next = pc(sample(()=>missRatio(false)));
  } else if (t === 'reel'){
    label = '当たりの幅';
    now = Math.round(windows().hit)+'ms'; next = Math.round(sample(windows).hit)+'ms';
  } else if (t === 'cool'){
    label = '売値'; now = mul(sellMult()); next = mul(sample(sellMult));
  } else if (t === 'rod'){
    label = '自動の竿'; now = autoRodCount()+'本'; next = sample(autoRodCount)+'本';
  } else return '';
  const r = rateIfBuy(t);
  // 秒あたりの稼ぎが動くものだけ倍率を添える（9章）
  const tail = Math.abs(r-1) >= 0.005 ? '  稼ぎ '+mul(r) : '';
  return label+' '+now+' → '+next+tail;
}

/* ---------------------------------------------------------------------------
   パークの効果を数で見せる（9章 画面B）。
   相場は「取ると何がどれだけ上がるか」を具体的な数で出すこと。
   買った効果が測れない、という文句がジャンルの定番になっている
   （gamedev/templates/sheets/genre/incremental.md）。
   ------------------------------------------------------------------------- */
const pc  = v => (v*100).toFixed(v*100<10?1:0)+'%';
const mul = v => '×'+(+v).toFixed(2);
const PERK_EFF = {
  // 無限段（2軸）。**次の一段を取ると何がどうなるか**を出す
  infCool: ()=>['売値の恒久倍率', mul(infCoolMult()),
                                  mul(infCoolMult()*T.infCoolEff)],
  infRod:  ()=>['開始時の自動の竿', infRodCount()+'本',
                                  infRodCountAt(infOf('rod')+1)+'本'],
  // 段数型
  rodAcc:  ()=>['自動の竿の精度',   pc(autoAcc()),         pc(autoAccAt(tierOf('rodAcc')+1))],
  carSlot: ()=>['持ち越しの枠',     carrySlots()+'枠',
                                  Math.min(TOOLS.length+1, carrySlots()+1)+'枠'],
  carKeep: ()=>['引継ぎ割合（竿）', pc(carryRate('carryRod')),
                                  pc(Math.min(1, T.carryRod*pow(T.carKeepMult, tierOf('carKeep')+1)))],
  // 有限段・一回きり
  pkBait1: ()=>['餌一段の効き',     pc(baitEff()),         pc(T.pkBait1v)],
  pkBait2: ()=>['餌の値段の伸び率', mul(toolGrow('bait')), mul(T.pkBait2v)],
  pkBait3: ()=>['餌一段の効き',     pc(baitEff()),         pc(T.pkBait3v)],
  pkReel1: ()=>['リール一段の効き', pc(reelEff()),         pc(T.pkReel1v)],
  pkReel2: ()=>['リールの伸び率',   mul(toolGrow('reel')), mul(T.pkReel2v)],
  pkReel3: ()=>['当たりの判定幅',   Math.round(windows().hit)+'ms',
                                    Math.round(windows().hit*(1+T.pkReel3v))+'ms'],
  pkRod1:  ()=>['竿の値段の伸び率', mul(toolGrow('rod')),  mul(T.pkRod1v)],
  pkCool2: ()=>['クーラーの伸び率', mul(toolGrow('cool')), mul(T.pkCool2v)],
  pkCool3: ()=>['完璧の倍率',       mul(perfectMult()),    mul(perfectMult()+T.pkCool3v)],
  pkLineAll:  ()=>['許される外し（手動）', pc(missRatio(false)), '10割'],
  pkLineAuto: ()=>['許される外し（自動）', pc(missRatio(true)),  '10割'],
  opn1:    ()=>['道具屋の竿',       '並ばない',            '並ぶ'],
  opn4:    ()=>['売る',             '手で押す',            '自動'],
  opn5:    ()=>['道具を買う',       '手で押す',            '自動（入切できる）'],
  opn6:    ()=>['自動の竿と超大物', '捌けない',            '捌ける'],
  opn7:    ()=>['図鑑',             '閉じている',          '開く'],
  opn8:    ()=>['売値（1種につき）','+0%',                 '+'+pc(T.opn8v)],
  opn9:    ()=>['未発見の出やすさ', mul(1),                mul(T.opn9v)],
  opn10:   ()=>['予兆の確率',       pc(T.omenRate),        pc(T.omenRate2)],
  opn11:   ()=>['待ち時間の下限',   T.capWaitLo+'秒',      T.opn11v+'秒'],
};
function perkEff(pk){
  const f = PERK_EFF[pk.id];
  if (!f) return pk.note || '';
  const [label, now, next] = f();
  return label+' '+now+' → '+next;
}

  goby   :{bh:0.66, hd:0.26, bw:18},   // はぜ（頭が大きい底もの）
  rock   :{bh:0.82, hd:0.28, bw:17},   // かさご（頭が大きく棘）
  dolphin:{bh:0.80, hd:0.18, bw:19},   // しいら（額が張り出す）
  bill   :{bh:0.46, hd:0.54, bw:20, sn:7},  // かじき（吻が7粒ぶん前に出る）
  angler :{bh:1.05, hd:0.34, bw:15},   // あんこう（丸い）
  fang   :{bh:0.90, hd:0.30, bw:15},   // おにきんめ（頭が大きい）
  ice    :{bh:0.62, hd:0.28, bw:19},   // あいすふぃっしゅ
  shark  :{bh:0.58, hd:0.40, bw:21},
  gshark :{bh:0.52, hd:0.46, bw:21, sn:4},  // みつくりざめ（平たい吻）
  eelshark:{bh:0.34, hd:0.34, bw:24},
  flat   :{bh:1.15, hd:0.50, bw:20},   // ひらめ（平たい・真上から見た形）
};

function fishArt(place, slot){
  // 種ごとに固定の見た目。乱数は使わない（同じ魚はいつも同じ形）
  const h = (((place*9 + slot + 1) * 2654435761) % 4294967296) >>> 0;
  const sp = spOf(place, slot);
  return { sp, grade: SLOT_GRADE[slot],
           v: k => ((h>>>(k*3))%5)/5 };      // 種ごとに固定の小さなゆらぎ
}

/* 魚の絵。**粒は一種類。**種ごとの体型・尾・ひれ・模様・色を、表から引いて描く。
   **格が上がるほど輪郭が濃くなり、主だけが光る** */
function drawFish(cx, cy, w, place, slot, opt){
  const A = fishArt(place, slot), sp = A.sp, o = opt||{};
  const px = Math.max(1, Math.round(w / FISH_GW));
  const x0 = Math.round(cx - FISH_GW*px/2), y0 = Math.round(cy - FISH_GH*px/2);
  const my = (FISH_GH-1)/2;
  const has = f => sp.feat.indexOf(f) >= 0;
  const L = (dl,ds)=>'hsl('+sp.h+','+Math.max(0,sp.sa+(ds||0))+'%,'
                    +Math.max(3,Math.min(92,sp.li+(dl||0)))+'%)';
  if (A.grade===4 && !o.dark) glow(cx, cy, w*0.62, PLACES[place].glow, 0.30);

  const cell = new Array(FISH_GH*FISH_GW).fill(null);
  const body = new Array(FISH_GH*FISH_GW).fill(false);
  const put=(c,r,col)=>{ if(c>=0&&c<FISH_GW&&r>=0&&r<FISH_GH) cell[r*FISH_GW+c]=col; };
  const mark=(c,r,col)=>{ if(c>=0&&c<FISH_GW&&r>=0&&r<FISH_GH){
    cell[r*FISH_GW+c]=col; body[r*FISH_GW+c]=true; } };
  const isBody=(c,r)=> c>=0&&c<FISH_GW&&r>=0&&r<FISH_GH&&body[r*FISH_GW+c];

  /* --- 魚でないものは、別に描く（同じ胴の式に押し込むと全部魚になる） --- */
  if (['octo','dumbo','squid','bug','shrimp','turtle','newt','angler'].indexOf(sp.form)>=0){
    drawOther(sp, A, mark, put, my, L, has);
  } else {
    const F = FORM[sp.form] || FORM.fusi;
    const BW = F.bw, SN = F.sn||0, ry = (FISH_GH/2-2.2)*F.bh;
    /* 胴。**楕円をやめる。**口から頭の位置で太くなり、尾の付け根でまた細る。
       **背は丸く、腹は平ら。**頭の位置 hd が前だと なまず、後ろだと かじき */
    const prof = t => {
      const q = t < F.hd ? (t/F.hd)*0.5 : 0.5 + (t-F.hd)/(1-F.hd)*0.5;
      return Math.max(0.22, Math.pow(Math.sin(Math.PI*Math.min(1, 0.12+q*0.86)), 0.58));
    };
    const topAt=[], botAt=[];
    for (let c=0;c<=BW;c++){
      const t = c<SN ? 0 : (c-SN)/(BW-SN), hh = prof(t)*ry;
      topAt[c] = my - hh;
      botAt[c] = my + hh*(sp.form==='flat' ? 1.0 : 0.84);
    }
    // **吻。**かじき・みつくりざめは、口が前に細く突き出る
    for (let c=0;c<SN;c++){
      // **細い一本にする。**太いと吻ではなく頭の続きに見える
      const k = c/SN, h = sp.form==='gshark' ? (k<0.5?0:1) : (k<0.6?0:1);
      topAt[c] = my - h; botAt[c] = my + h + (sp.form==='gshark'?1:0);
    }
    for (let c=0;c<=BW;c++){
      const t0=Math.round(topAt[c]), b0=Math.round(botAt[c]);
      for (let r=t0;r<=b0;r++) mark(c,r, (r-my) > ry*0.36 ? L(16) : L(0));
    }
    const ped = botAt[BW]-topAt[BW];
    drawTail(sp, A, BW, ped, my, mark, L);
    drawDorsal(sp, A, topAt, botAt, BW, my, ry, mark, L, has);
    drawPattern(sp, A, topAt, botAt, BW, my, ry, mark, L);
    // 目。**洞窟の魚は目が無い**（色素も抜けている。britannica）
    if (!has('noeye')){
      const big = has('bigeye');
      const ec = Math.max(1, Math.round(BW*F.hd*0.30)), er = Math.round(my-2);
      const n = big?4:3;
      for (let i=0;i<n;i++) for (let j=0;j<n;j++)
        if (isBody(ec+i,er+j)) put(ec+i, er+j, '#0d1114');
      if (isBody(ec+n-1,er+n-1)) put(ec+n-1, er+n-1, o.dark?'#0d1114':'#dfe9ee');
    }
    drawFishFeat(sp, A, topAt, botAt, BW, my, ry, mark, put, L, has, isBody);
  }

  /* 輪郭。**格が上がるほど濃い**（雑魚には付けない）。真っ黒にはしない */
  const outline = A.grade>=1 ? 'hsl('+sp.h+',42%,'+Math.max(13,24-A.grade*3)+'%)' : null;
  if (outline){
    // **書き込む先を分ける。**読みながら書くと、輪郭が右と下へ広がる
    const src = cell.slice();
    const at=(c,r)=> c>=0&&c<FISH_GW&&r>=0&&r<FISH_GH&&src[r*FISH_GW+c];
    for (let r=0;r<FISH_GH;r++) for (let c=0;c<FISH_GW;c++){
      if (at(c,r)) continue;
      if (at(c-1,r)||at(c+1,r)||at(c,r-1)||at(c,r+1)) cell[r*FISH_GW+c]=outline;
    }
  }
  for (let r=0;r<FISH_GH;r++) for (let c=0;c<FISH_GW;c++){
    let col = cell[r*FISH_GW+c];
    if (!col) continue;
    if (o.dark) col = o.dark;
    ctx.fillStyle = col; ctx.fillRect(x0+c*px, y0+r*px, px, px);
  }
}

/* 尾。forked・lunate・truncate・rounded・pointed（biologyinsights.com） */
function drawTail(sp, A, BW, ped, my, mark, L){
  if (sp.tail==='none') return;
  const spread = {fork:1.30, lune:1.65, trunc:0.55, round:0.62, point:0.75}[sp.tail]||1.0;
  const len = sp.tail==='trunc' ? 4 : (sp.tail==='round' ? 4 : FISH_GW-1-BW);
  for (let t=1;t<=len;t++){
    const c = BW+t;
    let half = ped/2 + t*spread*0.62;
    if (sp.tail==='round') half = ped/2 + Math.sin(t/len*Math.PI*0.5)*2.2;
    if (sp.tail==='point') half = Math.max(0.5, ped/2 - t*0.18);
    for (let r=0;r<FISH_GH;r++){
      const dy = r-my;
      if (Math.abs(dy) > half) continue;
      // **外の端の真ん中をへこませる**（二叉・三日月だけ）。無いと団扇に見える
      const deep = sp.tail==='lune' ? 0.62 : (sp.tail==='fork' ? 0.45 : 0);
      if (deep && c >= BW+len-Math.round(len*deep*0.7) &&
          Math.abs(dy) < half*deep) continue;
      mark(c,r,L(-10));
    }
  }
}

/* 背びれ。低い low／高い high／長い long／棘 spiny／二つ two／三つ three／帆 sail */
function drawDorsal(sp, A, topAt, botAt, BW, my, ry, mark, L, has){
  const kind = sp.fin;
  if (kind==='none') return;
  const seg = (c0,c1,peak,spiky)=>{
    for (let c=c0;c<=c1;c++){
      const t=(c-c0)/Math.max(1,c1-c0);
      let hh = Math.round(peak*Math.sin(Math.PI*(0.14+t*0.72)));
      if (spiky && c%2===0) hh = Math.max(1, hh-1);
      const top = Math.round(topAt[Math.min(BW,c)]);
      for (let k=1;k<=hh;k++) mark(c, top-k, L(-14,-6));
    }
  };
  if (kind==='low')   seg(Math.round(BW*0.34), Math.round(BW*0.62), 2.6, false);
  if (kind==='high')  seg(Math.round(BW*0.28), Math.round(BW*0.52), 5.0, false);
  if (kind==='spiny') seg(Math.round(BW*0.26), Math.round(BW*0.60), 3.4, true);
  if (kind==='long')  seg(Math.round(BW*0.18), BW-1, 2.2, false);
  if (kind==='two'){ seg(Math.round(BW*0.26), Math.round(BW*0.44), 3.4, true);
                     seg(Math.round(BW*0.54), Math.round(BW*0.74), 2.4, false); }
  if (kind==='three'){ seg(Math.round(BW*0.20), Math.round(BW*0.34), 2.8, false);
                       seg(Math.round(BW*0.42), Math.round(BW*0.58), 2.6, false);
                       seg(Math.round(BW*0.66), Math.round(BW*0.82), 2.4, false); }
  if (kind==='sail'){                                   // ばしょうかじき の帆
    for (let c=Math.round(BW*0.28); c<=Math.round(BW*0.78); c++){
      const t=(c-BW*0.28)/(BW*0.5);
      const hh = Math.round(6.6*Math.sin(Math.PI*(0.10+t*0.8)));
      const top = Math.round(topAt[Math.min(BW,c)]);
      for (let k=1;k<=hh;k++) mark(c, top-k, L(-12,-10));
    }
  }
  // 腹びれ・胸びれは、どの魚にも付ける
  for (let i=0;i<4;i++){
    const c = Math.round(BW*0.48)+i, bot = Math.round(botAt[Math.min(BW,c)]);
    mark(c, bot+1, L(-6,-8)); if (i===1||i===2) mark(c, bot+2, L(-6,-8));
  }
  const pc = Math.round(BW*0.30), pb = Math.round(my + ry*0.42);
  for (let i=0;i<3;i++){ mark(pc+i, pb, L(-12,-8));
    if (i>0) mark(pc+i, pb+1, L(-12,-8)); }
}

/* 模様。**調べたものをそのまま形にする** */
function drawPattern(sp, A, topAt, botAt, BW, my, ry, mark, L){
  const inBody=(c,r)=> r>=Math.round(topAt[c]) && r<=Math.round(botAt[c]);
  const P = sp.pat;
  for (let c=0;c<=BW;c++) for (let r=0;r<FISH_GH;r++){
    if (!inBody(c,r)) continue;
    const dy = r-my, t=c/BW;
    if (P==='back'   && dy < -ry*0.24) mark(c,r,L(-16,4));
    if (P==='vbar'   && c%3===1 && dy < ry*0.30) mark(c,r,L(-18,4));   // 横縞（体側の縦の縞）
    if (P==='hstripe'&& Math.abs(dy) < 1.2 && c>BW*0.14) mark(c,r,L(-20,6));
    if (P==='hline'  && dy > ry*0.05 && (r%2===1)) mark(c,r,L(-14,2));
    if (P==='spot'   && (c*3+r*5)%11===0 && dy < ry*0.44) mark(c,r,L(-22,-6));
    if (P==='pale'   && (c*3+r*5)%9===0 && dy < ry*0.44) mark(c,r,L(24,-14));
    // **まだらは規則的にしない。**割り算の余りで出すと市松に見える
    if (P==='mottle' &&
        Math.sin(c*1.7+r*2.9)*Math.cos(c*0.8-r*1.4) > 0.12) mark(c,r,L(-13,2));
    // 網（鱗）は規則的でよい。ただし**差を小さく**しないと市松になる
    if (P==='net' && ((c + (r%2?1:0)) % 3 === 0)) mark(c,r,L(-5,0));
    if (P==='wave'   && dy < -ry*0.10 &&
        Math.abs(dy + ry*0.40 + Math.sin(c*0.9)*1.5) < 1.1) mark(c,r,L(-20,4));
    if (P==='band'){                                    // 目を通る斜めの帯（かんぱち）
      if (Math.abs((r - my) - (c - BW*0.22)*0.9) < 1.3 && c < BW*0.5) mark(c,r,L(-18,4));
    }
    if (P==='clear'  && dy < -ry*0.34) mark(c,r,L(-10,0));  // 半透明ものは背だけ薄く濃い
  }
}

/* 種ごとの飾り。**その種にしか無いもの。**
   名前を drawFishFeat にしてある ── drawFeat は釣り場の描き込みで使っていて、
   同じ名前で二つ定義すると**後のほうが勝って、こちらが一度も呼ばれなかった** */
function drawFishFeat(sp, A, topAt, botAt, BW, my, ry, mark, put, L, has, isBody){
  const F = FORM[sp.form]||FORM.fusi;
  if (has('barbel')){                                   // 口ひげ（なまず・こい・どじょう）
    const y = Math.round(my+1);
    mark(1,y+1,L(-6,-14)); mark(0,y+2,L(-6,-14));
    mark(1,y-1,L(-6,-14)); mark(0,y-2,L(-6,-14));
  }
  if (has('scute')){                                    // 稜鱗（あじ。側線の全域）
    for (let c=Math.round(BW*0.40); c<=BW; c++) mark(c, Math.round(my+1), L(20,-10));
  }
  if (has('row')){                                      // 体側の点列（いわし）
    for (let c=2;c<=BW-2;c+=3) mark(c, Math.round(my-1), L(-16,0));
  }
  if (has('finlet')){                                   // 離鰭（さば・まぐろ）
    for (let c=BW-5;c<BW;c+=2){
      mark(c, Math.round(topAt[c])-1, L(-12,-8));
      mark(c, Math.round(botAt[c])+1, L(-12,-8));
    }
  }
  if (has('earspot')) mark(Math.round(BW*0.30), Math.round(my-1), L(-30,10)); // 鰓ぶたの黒点
  if (has('fangs')){                                    // 牙
    const y=Math.round(my+1);
    put(1,y,'#e8eef2'); put(2,y+1,'#e8eef2'); put(3,y,'#e8eef2');
  }
  if (has('lure')){                                     // ちょうちん（えさ）
    const c=Math.round(BW*0.34), top=Math.round(topAt[c]);
    mark(c, top-1, L(-10)); mark(c-1, top-2, L(-10)); mark(c-2, top-3, L(-10));
    put(c-3, top-4, '#ffe9b0'); put(c-4, top-4, '#ffe9b0');
    put(c-3, top-5, '#ffe9b0'); put(c-4, top-5, '#ffe9b0');
  }
  if (has('crest')){                                    // 赤い冠（りゅうぐうのつかい）
    // **頭から扇のように立てる。**一本だと冠に見えない
    for (const [c,h] of [[1,4],[2,6],[3,7],[4,5]])
      for (let k=1;k<=h;k++) mark(c, Math.round(topAt[Math.min(c,BW)])-k, '#d9534f');
    for (let c=5;c<=BW-2;c++) mark(c, Math.round(topAt[c])-1, '#c0504c');  // 背びれも赤い
  }
  if (has('jaw')){                                      // 突き出る顎（みつくりざめ）
    const y=Math.round(my+2);
    for (let c=0;c<4;c++) mark(c, y, L(-6,-10));
  }
  if (has('frill')){                                    // えらの襞（らぶか）
    for (let c=2;c<6;c++) mark(c, Math.round(botAt[c]), L(-18,4));
  }
  if (has('gills')){                                    // 外鰓（ほらいもり）
    for (let k=0;k<3;k++){ put(4, Math.round(my-3-k), '#d97a7a');
      put(5, Math.round(my-3-k), '#d97a7a'); }
  }
  if (has('twoeye')){                                   // 目が片側に二つ（ひらめ）
    put(3, Math.round(my-3), '#0d1114'); put(4, Math.round(my-3), '#0d1114');
    put(3, Math.round(my-1), '#0d1114'); put(4, Math.round(my-1), '#0d1114');
  }
  if (has('blunt')){                                    // 鈍い頭（にしおんでんざめ）
    for (let r=Math.round(my-2); r<=Math.round(my+2); r++) mark(0,r,L(-4));
  }
}

/* 魚でないもの。**同じ胴の式に押し込むと、全部魚になる。**
   たこ・いか・すっぽん・えび・だんごむし・ほらいもり は、それぞれ別に描く */
function drawOther(sp, A, mark, put, my, L, has){
  const F = sp.form, M = Math.round(my);
  const eye = (c,r,w)=>{ const n=w||2;
    for (let i=0;i<n;i++) for (let j=0;j<n;j++) put(c+i,r+j,'#0d1114');
    if(!has('noeye')) put(c+n-1,r+n-1,'#dfe9ee'); };
  const blob = (cx,cy,rx,ry,col)=>{
    for (let c=Math.round(cx-rx);c<=Math.round(cx+rx);c++)
      for (let r=Math.round(cy-ry);r<=Math.round(cy+ry);r++){
        const dx=(c-cx)/rx, dy=(r-cy)/ry;
        if (dx*dx+dy*dy<=1) mark(c,r,col);
      }
  };
  if (F==='octo'){                       // たこ ── 丸い頭が左、腕が八本うしろへ
    blob(7, M-2, 5.2, 4.6, L(0));                       // 頭（外套）
    blob(11, M+1, 3.4, 3.0, L(-4));                     // 目のあたりの膨らみ
    /* 腕。**続いた線にする。**粒を飛ばすと点線に見えた。
       根もとは太く、先へ細く、少しうねる */
    for (let i=0;i<8;i++){
      const sp2 = (i-3.5)/3.5;
      let r = M + sp2*1.6;
      for (let t=0;t<13;t++){
        const c = 13+t;
        r += sp2*0.52 + Math.sin(t*0.8+i*1.7)*0.28;
        const th = t<4 ? 1 : 0;                        // 根もとだけ二粒ぶん
        for (let k=-th;k<=0;k++) mark(c, Math.round(r)+k*(sp2>0?-1:1), L(-6+(i%2)*5));
      }
    }
    eye(9, M-3); eye(9, M+1);                           // 目は横に二つ
    return;
  }
  if (F==='angler'){                     // ちょうちんあんこう ── 丸い体・大きな口・提灯
    blob(12, M, 7.0, 6.2, L(0));                        // 丸い体
    for (let c=4;c<=11;c++){                            // 上を向いた大きな口
      const g = Math.round((11-c)*0.55);
      for (let r=0;r<=g;r++) mark(c, M+2+r, L(-14));
    }
    for (let i=0;i<5;i++){                              // 牙（上下）
      const c=5+i*1.4|0;
      put(c, M+2, '#e8eef2'); put(c+1, M+3+((i%2)?1:0), '#e8eef2');
    }
    for (let t=0;t<5;t++) mark(19+t, M+Math.round(t*0.2), L(-8));   // 細い尾の柄
    for (let k=0;k<4;k++)                               // 丸い尾びれ
      for (let j=0;j<=2;j++){ mark(23+k>=FISH_GW?FISH_GW-1:23+k, M-j, L(-10));
                              mark(23+k>=FISH_GW?FISH_GW-1:23+k, M+j, L(-10)); }
    /* 提灯（誘引突起）。**釣り竿の形にする** ── 額から前へ伸びて、先が光る */
    const stalk=[[9,-7],[8,-8],[7,-9],[6,-9],[5,-9]];
    for (const [c,d] of stalk) mark(c, M+d, L(-6));
    for (let i=0;i<2;i++) for (let j=0;j<2;j++) put(3+i, M-10+j, '#ffe9b0');
    eye(9, M-3);
    return;
  }
  if (F==='dumbo'){                      // めんだこ ── 丸い体に耳のようなひれ
    blob(14, M+1, 5.0, 4.4, L(0));
    for (let k=0;k<5;k++){                              // 耳（ひれ）
      const h = 3-Math.abs(k-2);
      for (let j=0;j<=h;j++){ mark(8+k, M-4-j, L(-8)); mark(20-k, M-4-j, L(-8)); }
    }
    for (let i=0;i<6;i++){                              // 短い腕と傘膜
      const sp2=(i-2.5)/2.5;
      for (let t=0;t<4;t++) mark(Math.round(14+sp2*4.4+t*sp2*0.6), M+4+t, L(-6));
    }
    eye(11, M-1); eye(16, M-1);
    return;
  }
  if (F==='squid'){                      // いか ── とがった外套が左、腕と触腕が右
    for (let c=0;c<12;c++){                             // 外套（円錐）
      const t=c/11, h=Math.round(0.6+t*4.2);
      for (let r=-h;r<=h;r++) mark(c, M+r, c<3?L(-6):L(0));
    }
    for (let k=0;k<5;k++){                              // ひれ（外套の先。三角）
      const j0 = 5-k;
      for (let j=1;j<=j0;j++){ mark(k, M-1-j, L(-10)); mark(k, M+1+j, L(-10)); }
    }
    blob(14, M, 2.6, 3.2, L(-3));                       // 頭
    for (let i=0;i<8;i++){                              // 腕八本。短く太く
      const sp2=(i-3.5)/3.5;
      for (let t=0;t<6;t++){
        const r = Math.round(M+sp2*(1.2+t*0.62));
        mark(17+t, r, L(-8+(i%2)*4));
        if (t<3) mark(17+t, r+(sp2>0?1:-1), L(-6+(i%2)*4));
      }
    }
    for (const d of [-1,1]){                            // 触腕二本（長く、先が広がる）
      // **開きすぎない。**左右いっぱいに広げると、いかではなく蝶ネクタイに見えた
      for (let t=0;t<10;t++)
        mark(17+t, Math.round(M+d*(1.4+t*0.38)+Math.sin(t*0.7)*0.8), L(-2));
      for (let k=0;k<3;k++)
        for (let j=0;j<2;j++) mark(FISH_GW-3+j, Math.round(M+d*(4.6+k*0.6)), L(6));
    }
    eye(12, M-2, 3);
    return;
  }
  if (F==='bug'){                        // だいおうぐそくむし ── 節のある甲
    for (let c=3;c<FISH_GW-7;c++){
      const t=(c-3)/(FISH_GW-11), h = Math.round(5.4*Math.sin(Math.PI*(0.14+t*0.78)));
      for (let r=-h;r<=h;r++) mark(c, M+r, (c%2)? L(-7) : L(3));   // 節の縞
    }
    for (let i=0;i<7;i++){                              // 脚
      const c=5+i*2, h=5;
      mark(c, M+h, L(-14)); mark(c+1, M+h+1, L(-14));
      mark(c, M-h, L(-14)); mark(c+1, M-h-1, L(-14));
    }
    for (let k=0;k<4;k++){                              // 尾扇
      for (let j=0;j<=2;j++) mark(FISH_GW-7+k, M-j, L(-4)), mark(FISH_GW-7+k, M+j, L(-4));
    }
    for (let k=0;k<3;k++){ mark(2-k>=0?2-k:0, M-2-k, L(-10)); }   // 触角
    eye(4, M-3); eye(4, M+2);
    return;
  }
  if (F==='shrimp'){                     // えび ── 曲がった体、長い触角、尾扇
    for (let c=6;c<FISH_GW-6;c++){
      const t=(c-6)/(FISH_GW-12);
      const bend = Math.round(Math.sin(t*Math.PI*0.9)*2.4);
      const h = Math.round(3.2*Math.sin(Math.PI*(0.18+t*0.72)));
      for (let r=-h;r<=h;r++) mark(c, M+r-bend, (c%2)?L(-5):L(2));
    }
    for (let k=0;k<7;k++) mark(5-k>=0?5-k:0, M+1+Math.round(k*0.5), L(-8));  // 触角
    for (let k=0;k<7;k++) mark(5-k>=0?5-k:0, M-1-Math.round(k*0.4), L(-8));
    for (let i=0;i<5;i++){ mark(8+i, M+3, L(-12)); mark(8+i, M+4, L(-12)); } // 脚
    for (let k=0;k<3;k++)                                // 尾扇。**体の後ろにつなげる**
      for (let j=0;j<=2+k;j++){ mark(FISH_GW-6+k, M-2-j, L(-3));
                                mark(FISH_GW-6+k, M+j-2, L(-3)); }
    eye(6, M-2);
    return;
  }
  if (F==='turtle'){                     // すっぽん ── 平たい甲羅と長い首
    /* 甲羅は**平たく**する。丸く盛ると、ただの塊に見えた */
    blob(16, M, 7.6, 3.6, L(0));
    blob(16, M, 5.0, 2.2, L(5));                        // 甲羅の中の盛り上がり
    for (let c=9;c<=23;c++) mark(c, M-3, L(-12));       // 甲羅の縁
    for (let c=9;c<=23;c++) mark(c, M+3, L(-12));
    for (let c=3;c<10;c++){                             // 首（左へ長く伸びる）
      const h = c<6 ? 0 : 1;
      for (let r=-h;r<=h;r++) mark(c, M-1+r, L(6,-8));
    }
    for (let c=0;c<3;c++) mark(c, M-1, L(10,-10));      // とがった鼻先
    for (const [c,r] of [[11,4],[12,5],[20,4],[21,5],[11,-4],[12,-5],[20,-4],[21,-5]])
      mark(c, M+r, L(-4,-8));                           // 手足（水かき）
    for (let k=0;k<3;k++) mark(24+k>=FISH_GW?FISH_GW-1:24+k, M, L(-6,-8));  // 尾
    eye(3, M-2);
    return;
  }
  if (F==='newt'){                       // ほらいもり ── 細長い体、外鰓、短い手足
    for (let c=2;c<FISH_GW-4;c++){
      const t=c/FISH_GW;
      const h = c<6 ? 1 : (c<10 ? 1 : Math.max(0, Math.round(1.4-t*1.0)));
      for (let r=-h;r<=h;r++) mark(c, M+r, L(0));
    }
    for (let k=0;k<5;k++)                               // 尾びれ（平たい）
      for (let j=0;j<=2;j++){ mark(FISH_GW-5+k, M-j, L(-6)); mark(FISH_GW-5+k, M+j, L(-6)); }
    for (const [c,r] of [[9,3],[10,4],[18,3],[19,4],[9,-3],[18,-3]])
      mark(c, M+r, L(-4,-8));                           // 短い手足
    if (has('gills'))                                   // 外鰓（頭のうしろの赤い房）
      for (let k=0;k<3;k++){
        mark(7+k, M-2-Math.round(k*0.7), '#d97a7a');
        mark(7+k, M+2+Math.round(k*0.7), '#d97a7a');
      }
    eye(3, M-2);
    return;
  }
}

function fishW(grade){ return T.fishSmall * (1 + grade*T.fishGradeStep); }

/* ---------------------------------------------------------------------------
   買う（道具屋）・釣り場・転生
   ------------------------------------------------------------------------- */
function shopList(){
  const out=[];
  for (const t of TOOLS){
    if (t.id==='rod' && !has('opn1')) continue;
    out.push({kind:'tool', id:t.id, name:t.n, price:toolPrice(t.id), lv:S.tools[t.id]});
  }
  const np = nextPlace();
  if (np>=0 && !S.unlockedPlace[np])
    out.push({kind:'move', id:np, name:PLACES[np].move, price:moveCost(np), lv:0});
  return out;
}
function buy(item){
  if (S.money < item.price) return false;
  S.money -= item.price;
  if (item.kind==='tool'){
    S.tools[item.id]++;
    if (item.id==='rod'){ syncRods(); }
  } else {
    S.unlockedPlace[item.id] = true;
    note(PLACES[item.id].n+' を開けた');
    S.rec.unlocked.push('釣り場:'+PLACES[item.id].n);
  }
  save();
  return true;
}
function autoBuy(){                    // 開く型5：安いものから順に（10章10）
  if (!has('opn5') || S.autoBuyOn===false) return;   // 切ると手で買う（10章10）
  // 次の移動手段のぶんは残す。残さないと移動手段が永久に買えない（10章10）
  const np = nextPlace();
  const keep = (np>=0 && !S.unlockedPlace[np]) ? moveCost(np) : 0;
  const list = shopList().filter(i=>i.kind==='tool').sort((a,b)=>a.price-b.price);
  for (const it of list) if (S.money - it.price >= keep){ buy(it); return; }
}
function gotoPlace(p){
  if (!S.unlockedPlace[p]) return;
  S.place = p; omenCasts = 0; omenUp = 0; omenCool = 0; omenSound(false);
  for (const r of rods){ r.phase='idle'; r.t=0; }
  fxAdd('place');
  bgmStart();
}
function buyPerk(pk){
  if (perkDone(pk) || !perkOpen(pk)) return;
  const c = perkCost(pk);
  if (S.pres < c) return;
  S.pres -= c;
  if (pk.type==='one')      S.perks[pk.id] = true;
  else if (pk.type==='tier')S.tier[pk.id] = tierOf(pk.id) + 1;
  else                      S.inf[pk.id==='infCool'?'cool':'rod'] = perkStep(pk) + 1;
  // 枠を減らす向きには動かないが、上限を超えて選んだままにはしない
  if (pk.id==='carSlot') S.carrySel = S.carrySel.slice(0, carrySlots());
  S.rec.unlocked.push('パーク:'+pk.name
    + (pk.type==='one' ? '' : '（'+perkStep(pk)+'段目）'));
  if (['opn1','opn4','opn5','opn6'].includes(pk.id)){
    fxAdd('auto'); S.rec.unlocked.push('自動化:'+pk.name);
  }
  syncRods(); save();
}
function endRun(){                     // 画面Bへ
  sellAll();
  S.rec.sec = (performance.now()-S.rec.t0)/1000;
  S.rec.bestCombo = bestComboRun;
  // 転生通貨は画面Bへ入る時点で入る。画面Bのパーク一覧で、その場で使える
  if (!S.rec.presPaid){
    S.rec.presGot = presGain(S.rec.earn);
    S.pres += S.rec.presGot;
    S.rec.presPaid = true;
  }
  scr='B'; overlay=null; omenSound(false); bgmStop(); save();
}
function doPrestige(){
  // 転生通貨は endRun() で入れ済み。ここでは足さない
  S.lifeEarn = (S.lifeEarn||0) + Math.max(0, S.rec.earn);   // **先に足さない。**presGain が差分で出す
  S.lastEarn = S.rec.earn;
  S.history.push(JSON.parse(JSON.stringify(S.rec)));
  S.totalSec += S.rec.sec;

  // 持ち越し（7章）。選んだ道具の段数を割合で持ち越す
  const keep = {bait:0,line:0,reel:0,cool:0,rod:0};
  const sel = S.carrySel.slice(0, carrySlots());
  let money = 0;
  for (const id of sel){
    if (id==='money'){ money = Math.floor(S.money * carryRate('carryMoney')); continue; }
    const t = TOOLS.find(x=>x.id===id);
    keep[id] = Math.floor(S.tools[id] * carryRate(t.carry));   // 端数は切り捨て（10章）
  }
  S.tools = keep;
  S.money = money;
  creel = 0; combo = 0; bestComboRun = 0; omenCasts = 0; omenUp = 0; omenCool = 0;
  S.run++; S.rec = newRunRecord(S.run);
  fxAdd('prestige');
  scr='C'; syncRods(); save();
}
function checkClear(){
  if (!S.cleared && S.dex[7][8]){
    S.cleared = true; S.clearRun = S.run;
    S.clearSec = S.totalSec + (performance.now()-S.rec.t0)/1000;
    note('クラーケンを釣った。'+S.clearRun+'周目／'+fmtSec(S.clearSec));
    save();
  }
}

   セーブ（10.5章）
   ------------------------------------------------------------------------- */
/* 保存の版。**つまみの名前や意味を変えたら上げる。**
   2 …… 第36版。12章のつまみを総入れ替えした（lySea などは名前が同じで意味が違う） */
const SAVE_V = 2;
function snapshot(){
  return {v:SAVE_V, S:{...S, rec:{...S.rec, t0:0}}, T:{...T}, creel, combo, bestComboRun,
          place:S.place, scr, runElapsed:(performance.now()-S.rec.t0)/1000};
}
function save(){
  if (!T.autoSave) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot())); }catch(e){}
}
function load(obj){
  try{
    const d = obj || JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if (!d || !d.S) return false;
    /* 古い保存から、**意味の変わったつまみを持ち込ませない。**
       第36版で12章のつまみを総入れ替えしたので、名前が同じで意味が違うものが在る
       （lySea は「本体に対する割合 0.66」→「画面ぜんぶに対する割合 0.80」）。
       絵が壊れて見えるので、**12章だけ捨てて既定に戻す。**他の章の調整は残す */
    const t = {...(d.T||{})};
    if ((d.v||1) < SAVE_V){
      for (const row of TUNE_DEF)                 // 表の名前は TUNE_DEF。**TUNE は無い**
        if (row[1] === '12. 画面') delete t[row[0]];
    }
    Object.assign(T, t);
    S = d.S; S.rec = S.rec || newRunRecord(S.run||1);
    S.rec.t0 = performance.now() - (d.runElapsed||0)*1000;
    creel = d.creel||0; combo = d.combo||0; bestComboRun = d.bestComboRun||0;
    scr = d.scr==='B' ? 'C' : (d.scr||'C');
    syncRods(); return true;
  }catch(e){ return false; }
}
/* 最初から（10.5章・第37版）。**保存も、つまみも、全部戻す。**
   横のパネルの「最初から」しか無く、**スマホでは画面の下まで送らないと届かなかった。**
   しかも確認が無く、一度触れば消えた。**二段にして、画面の中からも触れるようにする。** */
function resetAll(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  for (const [id,,,v] of TUNE_DEF) T[id] = v;      // つまみも既定へ
  S = newState(); scr='C'; overlay=null; combo=0; bestComboRun=0;
  creel=0; rods.length=0; fx.length=0; dexSel=null;
  syncRods(); fitCanvas();
  if (typeof syncTunerInputs==='function') syncTunerInputs();
  note('最初から');
}
/* 二段の確認。**押した直後だけ「消す」が出る。**放っておくと戻る */
let resetArm = 0;
/* **0 は「押していない」。**0 のまま引き算すると、読み込み直後の数秒が
   ずっと「確認が出ている」状態になり、**開いた瞬間に「消す」が押せた** */
function resetArmed(){
  return resetArm > 0 && performance.now()/1000 - resetArm < T.resetArmSec;
}

function exportStr(){ return btoa(unescape(encodeURIComponent(JSON.stringify(snapshot())))); }
function importStr(s){
  try{ return load(JSON.parse(decodeURIComponent(escape(atob(s.trim()))))); }
  catch(e){ return false; }
}
function fmtSec(s){
  s = Math.floor(s); const h=(s/3600)|0, m=((s%3600)/60)|0, x=s%60;
  return (h?h+'時間':'')+(h||m?m+'分':'')+x+'秒';
}

/* ---------------------------------------------------------------------------
   入力（3章・9章）。入力は二種類だけ：単押しと押しっぱなし
   ------------------------------------------------------------------------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let hotspots = [];                      // {x,y,w,h,fn}
let blocked = ()=> performance.now()/1000 < blockUntil;

function press(down){
  if (blocked()) return;
  const r = rods[0]; if (!r) return;
  if (scr!=='A' || overlay) return;
  if (r.phase==='idle'){ if (down) castRod(r); return; }
  if (r.phase!=='play') return;
  const t = r.t;
  if (down){
    r.holding = true; r.pressT = t;
    // 押した時刻を「一番近い符号」に割り当てる（3章）。
    // 判定の幅が隣と重なっても、中点で切れば曖昧な区間は生まれない
    /* **窓に入っている符号のうち、いちばん早いものを掴む**（3章）。
       前は「いちばん近い符号」だったので、押した位置によっては
       **光の線より先の符号を、手前の符号より先に掴むこと**があった（順番が飛ぶ） */
    const w0 = windows();
    let best=-1, bestD=Infinity;
    for (let i=0;i<r.tl.syms.length;i++){
      if (r.res[i]) continue;                       // すでに決まった符号は対象外
      const d = Math.abs(t - r.tl.syms[i].start);
      if (d*1000 > w0.graze) continue;              // 窓の外は掴まない
      if (best < 0 || r.tl.syms[i].start < r.tl.syms[best].start){ best = i; bestD = d; }
    }
    const aMs = bestD*1000;
    if (best < 0){
      /* 掴まなかった。**狙いも消す** ── 残しておくと、
         離したときに前の狙いが判定されてしまう（押してもいない符号が外しになる） */
      r.aim = -1;
      r.extra = (r.extra||0)+1;
      // 窓の外でも「早い／遅い」は出す（8章0）。掴まないので、
      // **向きだけは判定の済んだ符号も含めた一番近い符号から採る**
      let near = -1, nd = Infinity;
      for (let i=0;i<r.tl.syms.length;i++){
        const d = Math.abs(t - r.tl.syms[i].start);
        if (d < nd){ nd = d; near = i; }
      }
      pressBack('miss', near >= 0 ? t - r.tl.syms[near].start : 0, null, false);
      return;
    }
    r.aim = best;
    const sy0 = r.tl.syms[best];
    sy0.flash = performance.now()/1000;                // 符号が一瞬ふくらんで戻る（8章0）
    pressBack(aMs<=w0.hit ? 'hit' : 'graze', t - sy0.start,
              r.tl.mel ? r.tl.mel[best] : null, sy0.long && T.melHold);
  } else {
    if (!r.holding) return;
    r.holding = false;
    melStop();                                       // 長音の伸びを止める（8章0）
    const i = r.aim;
    // **狙っていないなら、何も判定しない**（窓の外で押したときは狙いが無い）
    if (i == null || i < 0) { r.pressT=-1; return; }
    const s = r.tl.syms[i];
    if (s==null || r.res[i]) { r.pressT=-1; return; }
    const held = t - r.pressT;
    // 長音は押し始めで判定する。ただし長さの8割より早く離したら外し
    const kindOk = s.long ? (held >= s.dur*T.holdKeep) : true;
    judgeSymbol(r, i, r.pressT - s.start, kindOk);
    if (s.long && !kindOk) releaseBack();          // 黙って外さない（8章0）
    r.idx = Math.max(r.idx, i+1);
    r.pressT = -1;
  }
}
window.addEventListener('keydown', e=>{
  if (e.repeat) return;
  if (e.code==='Space'||e.code==='KeyZ'||e.code==='Enter'){ e.preventDefault(); press(true); }
});
window.addEventListener('keyup', e=>{
  if (e.code==='Space'||e.code==='KeyZ'||e.code==='Enter'){ e.preventDefault(); press(false); }
});
function cvPos(ev){
  const b = cv.getBoundingClientRect();
  return {x:(ev.clientX-b.left)*(cv.width/b.width), y:(ev.clientY-b.top)*(cv.height/b.height)};
}
/* 押しは pointer で採る。mouse だけだと**スマホで長音が押せない。**
   触った指から作られる mousedown/mouseup は、指を離した瞬間に二つ並んで来るので、
   「押しっぱなし」の時間がいつも 0 になる（3章の押しっぱなしが成立しない）。
   pointer なら、マウスも指もペンも同じ道を通る。 */
let holdId = -1;                       // いま押している指。二本目は見ない
cv.addEventListener('pointerdown', ev=>{
  const p = cvPos(ev);
  for (let i=hotspots.length-1;i>=0;i--){
    const h = hotspots[i];
    if (p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){ h.fn(); return; }
  }
  if (holdId !== -1) return;           // 二本目の指は無視する
  holdId = ev.pointerId;
  // 指が帯の外へ動いても離しを受け取れるように、この要素で捕まえておく
  try { cv.setPointerCapture(ev.pointerId); } catch(e){}
  ev.preventDefault();
  press(true);
});
function pointerUp(ev){
  if (ev.pointerId !== holdId) return;
  holdId = -1;
  press(false);
}
cv.addEventListener('pointerup', pointerUp);
cv.addEventListener('pointercancel', pointerUp);
// 窓の外で指やボタンを離したとき。捕まえ損ねた場合の保険
window.addEventListener('pointerup', pointerUp);
cv.addEventListener('contextmenu', e=>e.preventDefault());

/* ---------------------------------------------------------------------------
   更新
   ------------------------------------------------------------------------- */
let last = performance.now();
function update(dt){
  const now = performance.now()/1000;
  fx = fx.filter(f=>f.until>now);
  toast = toast.filter(t=>t.until>now);
  if (blocked()) return;
  if (scr!=='A' || overlay) return;

  autoBuy();
  syncRods();

  // 予兆は時間で来る（4章）。竿を入れていなくても立つ
  if (omenCool > 0) omenCool -= dt;
  if (omenUp > 0){ omenUp -= dt; if (omenUp <= 0) omenSound(false); }
  else if (omenCool <= 0 && bossReady(S.place) && Math.random() < omenRate()*dt){
    omenUp = T.omenHold; omenSound(true);
  }

  for (const r of rods){
    if (r.phase==='idle'){
      // 自分の竿は押すまで振らない（4章）。自動の竿だけが勝手に投げ直す
      if (r.auto) castRod(r);
      continue;
    }
    r.t += dt;
    if (r.phase==='wait'){
      if (r.t >= r.wait) startChart(r);
    } else if (r.phase==='play'){
      // 拍を鳴らす（3章「カウントインの4拍だけ、一拍ごとに音を鳴らす」）。
      // **プレイヤーの竿だけ。**自動の竿は音を出さない（9章）
      if (!r.auto && T.countInSound){
        const b = Math.floor(r.t / beatSec());
        if (b !== r.countIn && b >= 0){
          r.countIn = b;
          const inCount = b < T.countInBeats;
          if (inCount || T.beatTick)
            beep(b % T.countInBeats === 0 ? T.tickHzTop : T.tickHz,
                 Math.max(0.004, T.tickMs/1000), 'square',
                 T.tickVol * (inCount ? 1 : 0.6));
        }
      }
      // 過ぎた符号を外しにする
      const w = windows();
      for (let i=0;i<r.tl.syms.length;i++){
        const s = r.tl.syms[i];
        if (!r.res[i] && r.t > s.start + w.graze/1000 && !(r.holding&&r.aim===i)) r.res[i]='miss';
      }
      if (r.t > r.tl.total + w.graze/1000){
        if (r.holding){ r.holding=false; }
        finishChart(r);
        checkClear();
      }
    }
  }
}

/* ---------------------------------------------------------------------------
   描画
   ------------------------------------------------------------------------- */
function fitCanvas(){ cv.width = T.scrW; cv.height = T.scrH; }
function box(x,y,w,h,fill,stroke){
  ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);
  if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,w-1,h-1); }
}
function txt(s,x,y,size,color,align){
  ctx.fillStyle=color||'#e8eef2'; ctx.textAlign=align||'left'; ctx.textBaseline='top';
  ctx.font = (size||12)+'px "Hiragino Kaku Gothic ProN","Noto Sans JP",monospace';
  ctx.fillText(s,x,y);
}
function hs(x,y,w,h,fn){ hotspots.push({x,y,w,h,fn}); }
/* 幅を決めて書く。**入らなければ後ろを切る。**
   切らないと、右にある値段と重なって両方読めなくなる */
function txtClip(s,x,y,size,color,maxW,align){
  ctx.font=(size||12)+'px "Hiragino Kaku Gothic ProN","Noto Sans JP",monospace';
  let t=s;
  if (ctx.measureText(t).width > maxW){
    while (t.length>1 && ctx.measureText(t+'…').width > maxW) t=t.slice(0,-1);
    t+='…';
  }
  txt(t,x,y,size,color,align);
}

function draw(){
  hotspots = [];
  ctx.clearRect(0,0,cv.width,cv.height);
  if (scr==='A') drawA();
  else if (scr==='B') drawB();
  else drawC();
  if (overlay==='dex') drawDex();
  if (overlay==='rec') drawRecOverlay();
  drawFxTop();
  drawEdge();
  drawToast();
}
/* 8章0。当たり・かすりは緑、外し・窓の外は赤で、画面の端が一瞬光る */
function drawEdge(){
  const a = 1 - (performance.now()/1000 - edgeAt)/Math.max(0.001, T.edgeSec);
  if (a<=0) return;
  ctx.globalAlpha = 0.55*a;
  ctx.strokeStyle = edgeKind==='miss' ? '#e0736b' : '#7fd6a0';
  ctx.lineWidth = 8; ctx.strokeRect(4, TOPH+4, cv.width-8, cv.height-TOPH-8);
  ctx.lineWidth = 1; ctx.globalAlpha = 1;
}

const TOPH = 22;
/* ---------------------------------------------------------------------------
   画面ぜんぶで使う部品（11章・第36版）
   **画面Aで決めたことを、他の画面にも通す。**
   地は深く落とす／明るいのは光っているものだけ／光の色は釣り場ごと
   ------------------------------------------------------------------------- */

/* どの画面の下敷きにも、いま居る釣り場の色を敷く。
   **画面を移っても、自分がどこに居るかが色で分かる** */
function drawGround(){
  const P = PLACES[S.place], W = cv.width, H = cv.height;
  const g2 = ctx.createLinearGradient(0,0,0,H);
  g2.addColorStop(0, dim(P.sky[0], T.uiGroundA));
  g2.addColorStop(0.45, dim(P.sea[1], T.uiGroundA));
  g2.addColorStop(1, dim(P.ground, T.uiGroundA));
  ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
  glow(W*T.glowSkyX, H*0.10, W*T.glowSky, P.glow, T.uiGlowA);
}

/* 札。**左の色帯が、その札がいまどの状態かを持つ。**
   状態は色だけでなく帯の有無でも出る（色だけだと、暗い画面で読めない） */
function card(x,y,w,h,kind){
  const P = PLACES[S.place];
  const F = {
    on   : {fill:'#1b3240', line:'#4a7d8e', bar:P.glow},        // 選んでいる
    can  : {fill:'#16262e', line:'#2f4a56', bar:P.glow},        // 押せる
    off  : {fill:'#101a1f', line:'#22333c', bar:'#2a3b44'},     // 押せない
    done : {fill:'#152c22', line:'#2f5a45', bar:'#7fd6a0'},     // 済み
    lock : {fill:'#0c1418', line:'#1a262d', bar:null},          // まだ開いていない
  }[kind] || {fill:'#101a1f', line:'#22333c', bar:'#2a3b44'};
  box(x,y,w,h,F.fill,F.line);
  if (F.bar){ ctx.fillStyle=F.bar; ctx.fillRect(x+1,y+1,T.uiBarW,h-2); }
  return F;
}

/* 釣り場の小さい絵。**画面Cの札と図鑑の見出しで使う。**
   画面Aの層をそのまま縮める（別の絵を用意すると、選んだ先と違う場所に見える） */
function drawMini(p, x, y, w, h, dark){
  const P = PLACES[p];
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  const k = dark ? 0.35 : 1;
  const bandY = (f)=> y + h*f;
  const lg=(y0,y1,c0,c1)=>{ const g2=ctx.createLinearGradient(0,y0,0,y1);
    g2.addColorStop(0,dim(c0,k)); g2.addColorStop(1,dim(c1,k)); ctx.fillStyle=g2;
    ctx.fillRect(x,y0,w,y1-y0); };
  lg(y, bandY(T.lyHzn), P.sky[0], P.sky[1]);
  if (!dark) glow(x+w*T.glowSkyX, bandY(T.glowSkyY), w*0.42, P.glow, 0.34);
  for (let kk=0;kk<3;kk++){                       // 遠景。**形は釣り場ごと**
    ctx.fillStyle = dim(P.far[kk], k);
    ctx.beginPath(); ctx.moveTo(x,bandY(T.lyHzn));
    for (let xx=0;xx<=w;xx+=3){
      const fy = farY(P.farK, kk, xx, w, h);      // 画面Aと同じ形の式
      ctx.lineTo(x+xx, y+fy);
    }
    ctx.lineTo(x+w,bandY(T.lyHzn)); ctx.closePath(); ctx.fill();
  }
  lg(bandY(T.lyHzn), bandY(T.lySea), P.sea[0], P.sea[1]);
  lg(bandY(T.lySea), y+h, P.deep[0], P.deep[1]);
  /* **光の柱は出さない。**この大きさだと柱が「光」ではなく「山」に見える。
     水面に一本、横の線だけ入れて水だと分かるようにする */
  if (!dark){
    ctx.globalAlpha=0.18; ctx.fillStyle=lit(P.sea[0],0.35);
    for (let yy=bandY(T.lyHzn)+3; yy<bandY(T.lySea); yy+=4)
      for (let xx=0;xx<w;xx+=4) if (Math.sin(xx*0.3+yy)>0.4) ctx.fillRect(x+xx,yy,2,1);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawTop(){
  const P = PLACES[S.place], W = cv.width;
  box(0,0,W,TOPH,'#080e12');
  ctx.fillStyle = dim(P.glow, 0.30); ctx.fillRect(0,TOPH-1,W,1);   // 下の縁に釣り場の色
  // 所持金。**光っているものは光る**（額は画面でいちばん動く数字）
  glow(56, TOPH/2, 64, P.glow, 0.10);
  txt('所持金 '+yen(S.money+creel), 8, 5, 12, lit(P.glow,0.30));
  txt('×'+combo+'連続', 200, 5, 12, combo>0?'#7fd6a0':'#4a5a63');
  /* 押すところは**タブ**。選ばれているものは下に線が入る
     （四角の色だけだと、暗い画面で入切が読めなかった） */
  let bx = W-4;
  const tab=(label,fn,on,accent)=>{
    ctx.font='11px monospace'; const w = ctx.measureText(label).width+16;
    bx -= w;
    if (on) box(bx,0,w,TOPH,'#16262e');
    txt(label,bx+8,5,11,on?'#e8eef2':(accent||'#7d919c'));
    if (on){ ctx.fillStyle=P.glow; ctx.fillRect(bx,TOPH-2,w,2); }
    hs(bx,0,w,TOPH,fn);
    bx -= 2;
  };
  tab('記録',()=>{overlay = overlay==='rec'?null:'rec';}, overlay==='rec');
  if (scr==='A') tab('転生',()=>endRun(), false);
  if (has('opn7')) tab('図鑑',()=>{overlay = overlay==='dex'?null:'dex';}, overlay==='dex');
  if (scr==='A') tab('釣り場',()=>{scr='C';}, false);
  if (!has('opn4') && scr==='A' && creel>0)
    tab('売る '+yen(creel),()=>sellAll(),false, lit(P.glow,0.2));
}

/* 色を暗いほうへ落とす。**手前へ来る層ほど強く落とす**（11章・第36版） */
function dim(hex, k){
  const v = parseInt(hex.slice(1),16);
  const r = Math.round(((v>>16)&255)*k), g2 = Math.round(((v>>8)&255)*k), b = Math.round((v&255)*k);
  return 'rgb('+r+','+g2+','+b+')';
}
/* 色を白のほうへ寄せる */
function lit(hex, k){
  const v = parseInt(hex.slice(1),16);
  const m = c => Math.round(c + (255-c)*k);
  return 'rgb('+m((v>>16)&255)+','+m((v>>8)&255)+','+m(v&255)+')';
}
/* 光源。丸くにじませる */
function glow(x,y,r,hex,a){
  const v = parseInt(hex.slice(1),16);
  const c = ((v>>16)&255)+','+(((v>>8)&255))+','+(v&255);
  const g2 = ctx.createRadialGradient(x,y,0,x,y,r);
  g2.addColorStop(0,'rgba('+c+','+a+')'); g2.addColorStop(1,'rgba('+c+',0)');
  ctx.fillStyle = g2; ctx.fillRect(x-r,y-r,r*2,r*2);
}

/* 遠景の形（11章・第36版）。**釣り場ごとに、そこに在るものを描く。**
   見本は山だったが、**洞窟に山は無いし、沖には陸が見えない。**
   三枚重ねるところ（k=0,1,2）は見本のまま。奥ほど暗く、手前ほど下へずれる */
function farY(kind, k, x, W, H){
  const t = x/W, amp = 14-k*4, hz = T.lyHzn;
  switch (kind){
    case 'oka':                                        // 山（澄んだ湖）
      return H*T.lyPeak + Math.sin(t*(2.4+k)+k*2)*amp + k*H*0.03;
    case 'dote':                                       // 土手（用水路）。低くて、なだらか
      return H*(hz-0.045) + Math.sin(t*(6+k*2)+k)*amp*0.35 + k*H*0.012;
    case 'ki':                                         // 木の生えた対岸（濁った川）
      return H*(hz-0.05) - Math.abs(Math.sin(t*(17+k*5)+k*3))*amp*0.55 + k*H*0.015;
    case 'suihei':                                     // 水平線だけ（堤防・荒れた沖）。陸が無い
      return H*(hz-0.022-k*0.007) + Math.sin(t*(3+k)+k)*2.5;
    case 'koori':                                      // 氷の乱氷（氷の下）。**角で立つ**
      return H*(hz-0.03) - Math.abs(((t*(4+k*1.5)+k*0.3)%1)-0.5)*amp*3.2 + k*H*0.014;
    case 'kabe':                                       // 岩の壁（洞窟）。高く塞ぐ
      return H*(0.17+k*0.035) + Math.sin(t*(5+k*3)+k*2)*amp*0.7;
    case 'iwa':                                        // 海底の岩（深海）。低くて角ばる
      return H*(hz-0.01) - (Math.abs(((t*(3.5+k))%1)-0.5)*2)*amp*1.5 + k*H*0.02;
  }
  return H*T.lyPeak + Math.sin(t*(2.4+k)+k*2)*amp + k*H*0.03;
}

/* その釣り場だけの描き込み（11章・第36版）。**一つの釣り場に一つだけ。**
   足すのは「その場所でしか起きないこと」に限る。濃さは T.featA で一括に動く。
   **どれも光源より明るくしない** ── 明の段に置くのは光っているものだけ（11章の決） */
function drawFeat(P, W, H, hzn, sea){
  const A = T.featA;
  const s = (x,y,w,h,c,a)=>{ ctx.globalAlpha=a; ctx.fillStyle=c; ctx.fillRect(x,y,w,h); };
  switch (P.feat){
    case 'kusa': {                                   // 用水路：手前の岸に草の穂
      ctx.globalAlpha = 0.85*A; ctx.strokeStyle = '#1d3324'; ctx.lineWidth = 1;
      for (let i=0;i<T.kusaN;i++){
        const x = (i*37)%W;
        const hi = x <= W*T.lyForeW;                    // 左は土手が高い（見本の影）
        const base = hi ? H*T.lyForeY + Math.sin(x*0.09)*3
                        : H*T.foreLipY + Math.sin(x*0.05)*2;
        const h = 6 + (i%5)*4, bend = ((i%3)-1)*3;
        ctx.beginPath(); ctx.moveTo(x, base+2);
        ctx.quadraticCurveTo(x+bend, base-h*0.6, x+bend*2, base-h); ctx.stroke();
      }
      ctx.globalAlpha = 1; break;
    }
    case 'nigori': {                                 // 濁った川：水面に濁りの筋
      for (let i=0;i<14;i++){
        const y = hzn + (sea-hzn)*((i+0.5)/14);
        s(0, y, W, 2+((i%3)*2), '#3a2c18', (0.05+0.05*(i%2))*A);
      }
      ctx.globalAlpha=0.10*A; ctx.fillStyle='#2a2620';       // 遠景がぼやける
      ctx.fillRect(0, hzn-H*0.10, W, H*0.10); ctx.globalAlpha=1; break;
    }
    case 'kiri': {                                   // 澄んだ湖：遠景の足元に霧の帯
      const g2 = ctx.createLinearGradient(0,hzn-H*0.16,0,hzn+H*0.03);
      g2.addColorStop(0,'rgba(190,214,220,0)');
      g2.addColorStop(0.55,'rgba(190,214,220,'+(T.kiriA*A).toFixed(3)+')');
      g2.addColorStop(1,'rgba(190,214,220,0)');
      ctx.fillStyle=g2; ctx.fillRect(0,hzn-H*0.16,W,H*0.19); break;
    }
    case 'teibou': {                                 // 堤防：遠景を横切る直線の護岸
      const y = hzn - H*0.045;
      s(0, y, W*0.62, H*0.045, '#0b0a10', 0.95*A);           // 堤体
      s(0, y, W*0.62, 2, '#221d26', 0.9*A);                  // 天端の縁
      for (let i=0;i<9;i++) s(W*0.03+i*W*0.066, y, 2, H*0.045, '#07060b', 0.8*A); // 継ぎ目
      break;
    }
    case 'ame': {                                    // 荒れた沖：雨の斜線と、高い波頭
      ctx.globalAlpha=0.22*A; ctx.strokeStyle='#b9ccd6'; ctx.lineWidth=1;
      for (let i=0;i<T.ameN;i++){
        const x=(i*97)%W, y=(i*131)%H, len=10+(i%4)*5;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-len*0.35,y+len); ctx.stroke();
      }
      ctx.globalAlpha=0.16*A; ctx.fillStyle='#c3d4dd';       // 波頭
      for (let i=0;i<20;i++){
        const t=(i%5)/5, y=hzn+(sea-hzn)*(0.15+t*0.8), x=(i*173)%W;
        ctx.fillRect(x, y, 18+t*40, 2);
      }
      ctx.globalAlpha=1; break;
    }
    case 'koori': {                                  // 氷の下：上端の氷の縁と、水面の割れ目
      s(0, 0, W, H*0.055, '#243a48', 0.95*A);                // 氷の天井
      s(0, H*0.055, W, 2, '#5c8296', 0.55*A);
      ctx.globalAlpha=0.30*A; ctx.strokeStyle='#a9cfe4'; ctx.lineWidth=1;
      for (let i=0;i<T.kooriN;i++){                          // 割れ目
        const x0=(i*151)%W, y0=hzn+(sea-hzn)*((i%4)/4+0.1);
        ctx.beginPath(); ctx.moveTo(x0,y0);
        ctx.lineTo(x0+30+(i%3)*26, y0+((i%2)?7:-7));
        ctx.lineTo(x0+70+(i%4)*20, y0+((i%2)?-4:9)); ctx.stroke();
      }
      ctx.globalAlpha=1; break;
    }
    case 'dokutsu': {                                // 洞窟：空の代わりに岩の天井
      /* **垂れる岩は一本ずつ長さと太さを変える。**
         同じ三角を並べると、洞窟ではなくのこぎりに見える */
      ctx.globalAlpha=0.97*A; ctx.fillStyle='#0a0806';
      ctx.fillRect(0,0,W,H*0.11);                            // 天井の板
      for (let i=0;i<T.iwaN;i++){
        const x = W*(i+0.5)/T.iwaN + ((i*29)%17-8);
        const w = 10+((i*13)%5)*7, len = H*(0.03+((i*7)%6)*0.022);
        ctx.beginPath(); ctx.moveTo(x-w/2, H*0.11);
        ctx.quadraticCurveTo(x-w*0.18, H*0.11+len*0.7, x+((i%2)?2:-2), H*0.11+len);
        ctx.quadraticCurveTo(x+w*0.18, H*0.11+len*0.7, x+w/2, H*0.11);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha=0.45*A; ctx.fillStyle='#3a2a1a';       // 天井の縁に松明が当たる
      ctx.fillRect(0,H*0.11,W,1); ctx.globalAlpha=1; break;
    }
    case 'shinkai': {                                // 深海：漂う生き物の光
      const v=parseInt(P.glow.slice(1),16);
      const c=((v>>16)&255)+','+((v>>8)&255)+','+(v&255);
      const t=performance.now()/1000;
      for (let i=0;i<T.hikaruN;i++){
        const x=(i*163)%W, y=hzn+((i*97)%Math.max(1,H-hzn));
        const a=(0.10+0.30*(0.5+0.5*Math.sin(t*0.7+i)))*A;
        const r=1.5+(i%3);
        ctx.fillStyle='rgba('+c+','+a.toFixed(3)+')';
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      }
      break;
    }
  }
}

function drawA(){
  const P = PLACES[S.place];
  const W = cv.width, H = cv.height;
  const shopW = Math.floor(W*T.shopW);
  const W2 = W-shopW;                        // 遊ぶところの幅（浮きの並びが使う）
  const hzn = H*T.lyHzn, sea = H*T.lySea;
  /* **見本（1と3を重ねた案）そのままの組み立て。**
     割合は画面ぜんぶに対してで、上端の帯と道具屋はこの上にかぶせる。
     **色だけが釣り場ごとに変わる**（層の並びと明るさの段は動かさない） */
  const lin=(x0,y0,x1,y1,stops)=>{ const g2=ctx.createLinearGradient(x0,y0,x1,y1);
    for(const [q,c] of stops) g2.addColorStop(q,c); ctx.fillStyle=g2; };

  // 地：深く落とす（3のやり方）
  ctx.fillStyle=P.ground; ctx.fillRect(0,0,W,H);
  // 層1 空（いちばん遠い＝いちばん明るいが、面積は小さい）
  lin(0,0,0,hzn,[[0,P.sky[0]],[1,P.sky[1]]]); ctx.fillRect(0,0,W,hzn);
  // 光源1 空の残光。**ここが明の段**
  glow(W*T.glowSkyX, H*T.glowSkyY, W*T.glowSky, P.glow, T.glowSkyA);
  // 層2 遠景（暗い切り抜き。彩度も明暗差も最小）
  for (let k=0;k<3;k++){
    ctx.fillStyle = P.far[k];
    ctx.beginPath(); ctx.moveTo(0,hzn);
    for(let x=0;x<=W;x+=8) ctx.lineTo(x, farY(P.farK, k, x, W, H));
    ctx.lineTo(W,hzn); ctx.closePath(); ctx.fill();
  }
  // 層3 水面（支配的な段。暗いほうに寄せる）
  lin(0,hzn,0,sea,[[0,P.sea[0]],[1,P.sea[1]]]); ctx.fillRect(0,hzn,W,sea-hzn);
  // 水面に伸びる反射の柱（3のやり方。ここも明の段）。**鏡の湖では長く、濁った川では短い**
  {
    const v=parseInt(P.glow.slice(1),16), c=((v>>16)&255)+','+((v>>8)&255)+','+(v&255);
    for(let y=hzn+H*0.005; y<sea; y+=T.grain*2){
      const t=(y-hzn)/(sea-hzn);
      const w=W*T.reflW0+t*W*T.reflW, j=Math.sin(y*0.9)*(3+t*20);
      const a=(T.reflA-(T.reflA*0.82)*t)*P.refl;
      ctx.fillStyle='rgba('+c+','+Math.max(0,a).toFixed(3)+')';
      ctx.fillRect(W*T.glowSkyX-w/2+j, y, w, T.grain);
    }
  }
  // さざなみ（明度差だけ。細く）。**荒れた沖では太く、氷の下ではほとんど無い**
  for(let y=hzn+H*0.01; y<sea; y+=T.grain*3){
    const t=(y-hzn)/(sea-hzn);
    ctx.globalAlpha=(T.ripA*0.7+T.ripA*(1-t))*P.rip; ctx.fillStyle=P.ripple;
    for(let x=0;x<W;x+=5) if (Math.sin(x*0.07+y*0.5)>0.6) ctx.fillRect(x,y,T.grain+t*3,1);
  }
  ctx.globalAlpha=1;
  // 層4 水中（もっと暗い）
  lin(0,sea,0,H,[[0,P.deep[0]],[1,P.deep[1]]]); ctx.fillRect(0,sea,W,H-sea);
  /* 層5 手前＝**自分が立っている岸。**見本の左の影はそのまま残し、
     **下の縁を画面の端まで延ばす** ── 竿は全部ここから出るので、根もとが乗る地面が要る */
  ctx.fillStyle=P.fore;
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,H*T.lyForeY);
  for(let x=0;x<=W*T.lyForeW;x+=6) ctx.lineTo(x, H*T.lyForeY+Math.sin(x*0.09)*3);
  for(let x=W*T.lyForeW;x<=W;x+=8) ctx.lineTo(x, H*T.foreLipY+Math.sin(x*0.05)*2);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  // 岸の上の縁。**ここが水ぎわ。**竿の根もとが乗る地面が見えないと、竿が浮いて見える
  ctx.globalAlpha=0.5; ctx.fillStyle=lit(P.fore,0.16);
  for(let x=W*T.lyForeW;x<=W;x+=4) ctx.fillRect(x, H*T.foreLipY+Math.sin(x*0.05)*2, 4, 1);
  ctx.globalAlpha=1;

  // その釣り場だけの描き込み
  drawFeat(P, W, H, hzn, sea);

  // 予兆で水面が金がかる
  const omen = rods.some(r=>r.omen && r.phase!=='idle');
  if (omen){ ctx.globalAlpha=0.30; ctx.fillStyle='#e8c05a';
             ctx.fillRect(0,hzn,W,H-hzn); ctx.globalAlpha=1; }

  /* 竿・糸・浮き。**手動も自動も、同じ手前の岸から出る**（第36版）。
     一本めは見本そのままの曲線で太く明るい。二本め以降は細く暗く、
     根もとを浮きより左に置いて外へ向けて倒す ── 立っている場所は同じ、投げた先が違う */
  const n = Math.min(rods.length, T.rodsDrawn);
  const usable = W-shopW;
  for (let i=0;i<n;i++){
    const r = rods[i];
    /* **手動の浮きは、竿が何本になっても同じところ。**
       等分にすると、竿が増えるほど手動が左の端へ寄って小さくなる（持っている竿なのに）。
       自動はその左右に散らす ── 真ん中の帯は空けて、手動と重ねない */
    let x;
    if (i===0) x = Math.floor(usable*T.handX);
    else {
      const t = (n===1) ? 0.5 : (i-1+0.5)/(n-1);
      const u = t<0.5 ? 0.10+t*0.64 : 0.58+(t-0.5)*0.68;
      x = Math.floor(usable*u);
    }
    const wob = (r.phase==='wait' && r.t > r.wait-0.6) ? Math.sin(performance.now()/60)*3 : 0;
    const hand = i===0;
    const fy = H*(T.lyFloat - (hand ? 0 : (i%3)*T.autoDepth)) + wob;
    const tipY = H*(hand ? T.rodTipY : T.autoTipY);
    let lineTop = tipY;
    ctx.lineCap='round';
    if (hand){
      const bx = W*T.rodX0, by = H*T.rodY0;
      ctx.strokeStyle=LAYER.rod; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(bx, by);
      // ふくらみは根もとと先のあいだ。**先より外へは出さない**＝逆へ反らない
      ctx.quadraticCurveTo(bx+(x-bx)*T.rodCX, by-(by-tipY)*T.rodCY, x, tipY);
      ctx.stroke();
    } else {
      // **一本ずつ振る。**同じ形を並べると判子に見える（i から決めるので毎回同じ）
      const v1=((i*7)%5)/5-0.4, v2=((i*11)%4)/4-0.35;
      const rx = Math.max(W*0.02, x - W*T.autoLean*(1+v1*0.5)), ry = H*T.foreLipY+v2*4;
      const ty = tipY + H*0.05*v2;
      ctx.globalAlpha=0.8;
      ctx.strokeStyle=LAYER.rodAuto; ctx.lineWidth=T.autoW;
      ctx.beginPath(); ctx.moveTo(rx, ry);
      ctx.quadraticCurveTo(rx+(x-rx)*0.30, ry-(ry-ty)*(T.autoBend+v1*0.10), x, ty);
      ctx.stroke(); ctx.globalAlpha=1; lineTop = ty;
    }
    ctx.lineCap='butt';
    ctx.strokeStyle=LAYER.line; ctx.lineWidth=1; ctx.globalAlpha=hand?1:0.55;
    ctx.beginPath(); ctx.moveTo(x,lineTop); ctx.lineTo(x,fy); ctx.stroke();
    ctx.globalAlpha=1;
    if (hand){
      // **光源2：浮きそのものが光る。**押す位置が画面でいちばん明るい点になる
      glow(x, fy+T.floatSize/2, T.glowFloat, P.glow, T.glowFloatA);
      ctx.fillStyle=LAYER.float; ctx.fillRect(x-T.floatSize/2, fy, T.floatSize, T.floatSize);
      ctx.fillStyle=LAYER.tip;   ctx.fillRect(x-T.floatSize/2, fy, T.floatSize, 3);
      if (r.phase==='idle') txt('押す',x-12,fy+14,10,'#e8eef2');
    } else {
      const fs = Math.max(3, T.floatSize-2);
      ctx.fillStyle=LAYER.floatAuto; ctx.fillRect(x-fs/2, fy, fs, fs);
    }
  }
  if (rods.length > T.rodsDrawn)
    txt('＋'+(rods.length-T.rodsDrawn)+'本', 6, H*T.lyFloat+10, 11, '#e8eef2');

  // 魚影（情報を持つもの）
  for (const r of rods){
    if (r.phase!=='wait') continue;
    const near = r.t > r.wait*0.65;
    if (!near) continue;
    const sz = r.omen ? T.fishSmall*2.2 : T.fishSmall*(0.6+r.grade*0.25);
    const x = ((performance.now()/16 + r.wait*97)%(usable+60))-30;
    ctx.globalAlpha=0.35; ctx.fillStyle='#0b1a20';
    ctx.fillRect(x, H*T.lyFloat+22+(r.grade*6), sz, sz*0.45); ctx.globalAlpha=1;
  }

  // 道具屋（右）
  drawShop(W-shopW, TOPH, shopW, H-TOPH);
  // 譜面の帯
  drawBand();
  drawTop();
  drawFxA();
}

function drawShop(x,y,w,h){
  box(x,y,w,h,'#0f191f','#2b3b46');
  txt('道具屋',x+6,y+4,12,'#9fb6c4');
  // 自動購入の入切（10章10「入切できる」）。取っていないあいだは出さない
  if (has('opn5')){
    const on = S.autoBuyOn!==false, bw2=76;
    box(x+w-bw2-6, y+2, bw2, 15, on?'#1c3a2c':'#2a1c1c', '#2b3b46');
    txt('自動購入 '+(on?'入':'切'), x+w-bw2-2, y+4, 10, on?'#7fd6a0':'#e0736b');
    hs(x+w-bw2-6, y+2, bw2, 15, ()=>{ S.autoBuyOn = !on; save(); });
  }
  let yy = y+22;
  for (const it of shopList()){
    const can = S.money>=it.price;
    box(x+4,yy,w-8,36, can?'#1a2c35':'#141d23','#2b3b46');
    txt(it.name + (it.kind==='tool'? ' '+it.lv : ''), x+8, yy+2, 11, can?'#e8eef2':'#5b6d78');
    txt(yen(it.price), x+w-8, yy+2, 10, can?'#e8c05a':'#5b6d78','right');
    /* 買うと何がどれだけ変わるか（9章）。**一行まるごと入る**のが決なので、
       節目の札を同じ行の右に置かない。**行を分ける**（重なっていた） */
    txt(toolEff(it), x+8, yy+16, 9, can?'#9fb6c4':'#4a5a63');
    // **次の節目まであと何段か（決）。**これは上限ではなく、次の褒美の位置
    if (it.kind==='tool'){
      const nx = msNext(it.id);
      const mm = milestone(it.id);
      const tag = nx ? 'あと'+nx.left+'段で ×'+T.msMult
                     : (mm>1 ? '節目ぜんぶ ×'+Math.round(mm) : '');
      if (tag) txt(tag, x+8, yy+26, 9, nx ? '#e8c05a' : '#7fd6a0');

    if (can) hs(x+4,yy,w-8,36, ()=>buy(it));
